[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apc"
version = "0.1.0"
description = "A retargetable compiler: language-independent IR, pluggable frontends and backends"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apc = "apc.driver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/apc"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src"]
