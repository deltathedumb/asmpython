[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asmpython"
version = "0.1.0"
description = "A retargetable compiler: language-independent IR, pluggable frontends and backends"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
asmpython = "asmpython.driver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The suite runs through `python -m tests.harness` -- see
# `tests/harness/README.md` for why this project has a runner of its own. The
# short version: its failures are diffs between four execution paths, and it
# is subprocess-bound enough to parallelise almost linearly.

[tool.ruff]
line-length = 88
src = ["src"]
