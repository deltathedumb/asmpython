name: Verify import resolution

on:
  push:
    branches: ["beta/3.14.0"]
    paths:
      - "asmpython/__init__.py"
      - "asmpython/_host_import_binary.py"
      - "asmpython/_backends/host_cli.py"
      - "asmpython/_backends/host_site_packages.py"
      - "asmpython/_compiler/cli.py"
      - "asmpython/_compiler/pypi.py"
      - "asmpython/_compiler/project.py"
      - "asmpython/_compiler/site_packages.py"
      - "asmpython/__main__.py"
      - "pyproject.toml"
      - "tests/cases/299_import_binary.py"
      - "tests/test_cli_import_policy.py"
      - "tests/test_import_binary_ctypes.py"
      - "tests/test_site_packages.py"
      - "tests/test_pip_install_integration.py"
      - "tests/test_selfhost_entrypoint.py"
      - ".github/workflows/import-resolution-verify.yml"
  pull_request:
    paths:
      - "asmpython/__init__.py"
      - "asmpython/_host_import_binary.py"
      - "asmpython/_backends/host_cli.py"
      - "asmpython/_backends/host_site_packages.py"
      - "asmpython/_compiler/cli.py"
      - "asmpython/_compiler/pypi.py"
      - "asmpython/_compiler/project.py"
      - "asmpython/_compiler/site_packages.py"
      - "asmpython/__main__.py"
      - "pyproject.toml"
      - "tests/cases/299_import_binary.py"
      - "tests/test_cli_import_policy.py"
      - "tests/test_import_binary_ctypes.py"
      - "tests/test_site_packages.py"
      - "tests/test_pip_install_integration.py"
      - "tests/test_selfhost_entrypoint.py"
      - ".github/workflows/import-resolution-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-import-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed Python files
        run: |
          python -m py_compile \
            asmpython/__init__.py \
            asmpython/_host_import_binary.py \
            asmpython/__main__.py \
            asmpython/_backends/host_cli.py \
            asmpython/_backends/host_site_packages.py \
            asmpython/_compiler/cli.py \
            asmpython/_compiler/pypi.py \
            asmpython/_compiler/project.py \
            asmpython/_compiler/site_packages.py \
            tests/cases/299_import_binary.py \
            tests/test_cli_import_policy.py \
            tests/test_import_binary_ctypes.py \
            tests/test_site_packages.py \
            tests/test_pip_install_integration.py \
            tests/test_selfhost_entrypoint.py
      - name: Run import policy tests
        run: |
          python -m unittest -v \
            tests.test_cli_import_policy \
            tests.test_import_binary_ctypes \
            tests.test_site_packages \
            tests.test_pip_install_integration \
            tests.test_selfhost_entrypoint

  native-import-binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NASM
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Compile and execute native import_binary case
        id: native_case
        continue-on-error: true
        run: |
          python - <<'PY' > native-import-binary-diagnostic.txt 2>&1
          from pathlib import Path
          from tests.runner import run_positive

          result = run_positive(Path("tests/cases/299_import_binary.py"), "linux")
          print(f"{result.name}: {'OK' if result.ok else 'FAIL'}")
          if result.detail:
              print(result.detail)
          raise SystemExit(0 if result.ok else 1)
          PY
      - name: Show native diagnostic
        if: always()
        run: cat native-import-binary-diagnostic.txt
      - name: Upload native diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-import-binary-diagnostic
          path: native-import-binary-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
      - name: Fail if native parity failed
        if: steps.native_case.outcome != 'success'
        run: exit 1
