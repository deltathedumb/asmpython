name: Diagnose typed unpacking

on:
  push:
    branches: [agent/python314-arm64-list-del]
    paths:
      - ".github/workflows/diagnose-typed-unpack.yml"
      - "asmpython/_compiler/**"
      - "tests/cases/440_str_unpack.py"
      - "tests/test_unpack_normalize_install.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm gcc
      - name: Capture compiler and execution diagnostics
        run: |
          set +e
          {
            echo '=== install tests ==='
            python -m unittest -v tests.test_unpack_normalize_install
            echo "install_status=$?"
            echo '=== build help ==='
            python -m asmpython build --help
            echo "help_status=$?"
            echo '=== compile string unpack ==='
            python -m asmpython build tests/cases/440_str_unpack.py \
              --target linux -o /tmp/str-unpack --no-pyinbin-fallback
            build_status=$?
            echo "build_status=$build_status"
            if [ "$build_status" -eq 0 ]; then
              echo '=== execute string unpack ==='
              /tmp/str-unpack
              echo "execute_status=$?"
              echo '=== file metadata ==='
              file /tmp/str-unpack
            fi
          } 2>&1 | tee typed-unpack-diagnostic.log
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: typed-unpack-diagnostic
          path: typed-unpack-diagnostic.log
