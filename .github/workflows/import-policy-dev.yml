name: Diagnose import policy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'beta/3.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply import policy fixes
        run: |
          python .github/dev/apply_import_policy_facade.py
          python .github/dev/apply_offline_pip_fixture.py
      - name: Compile changed sources
        run: |
          python -m py_compile \
            asmpython/__main__.py \
            asmpython/_backends/host_cli.py \
            asmpython/_backends/host_site_packages.py \
            asmpython/_compiler/cli.py \
            asmpython/_compiler/pypi.py \
            asmpython/_compiler/project.py \
            asmpython/_compiler/site_packages.py \
            tests/test_cli_import_policy.py \
            tests/test_site_packages.py \
            tests/test_pip_install_integration.py \
            tests/test_selfhost_entrypoint.py
      - name: Run complete import policy suite
        run: |
          python -m unittest -v \
            tests.test_cli_import_policy \
            tests.test_site_packages \
            tests.test_pip_install_integration \
            tests.test_selfhost_entrypoint
      - name: Commit verified import policy fixes
        run: |
          git config user.name "asmpython-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            asmpython/_backends/host_cli.py \
            asmpython/_compiler/cli.py \
            tests/test_pip_install_integration.py
          git commit -m "Keep native import policy deterministic"
          git push origin HEAD:beta/3.14.0
