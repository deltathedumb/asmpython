name: Diagnose import policy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'beta/3.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply public facade fix
        run: python .github/dev/apply_import_policy_facade.py
      - name: Run complete import policy suite with diagnostics
        run: |
          set +e
          python -m unittest -v \
            tests.test_cli_import_policy \
            tests.test_site_packages \
            tests.test_pip_install_integration \
            tests.test_selfhost_entrypoint \
            > import-policy-after-fix.log 2>&1
          status=$?
          echo "status=$status" | tee import-policy-after-fix.status
          cat import-policy-after-fix.log
          exit 0
      - name: Upload post-fix diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: import-policy-after-fix
          path: |
            import-policy-after-fix.log
            import-policy-after-fix.status
            asmpython/_backends/host_cli.py
            asmpython/_compiler/cli.py
