name: Diagnose import policy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'beta/3.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply public facade fix
        run: python .github/dev/apply_import_policy_facade.py
      - name: Capture pip environment and suppressed failure
        run: |
          set +e
          {
            python -m pip --version
            python - <<'PY'
          import importlib.metadata
          for name in ("pip", "setuptools", "wheel"):
              try:
                  print(name, importlib.metadata.version(name))
              except importlib.metadata.PackageNotFoundError:
                  print(name, "NOT INSTALLED")
          PY
            python - <<'PY'
          import subprocess
          import unittest

          original = subprocess.run

          def verbose_run(*args, **kwargs):
              try:
                  return original(*args, **kwargs)
              except subprocess.CalledProcessError as error:
                  print("COMMAND:", error.cmd)
                  print("RETURN CODE:", error.returncode)
                  print("STDOUT:")
                  print(error.stdout)
                  print("STDERR:")
                  print(error.stderr)
                  raise

          subprocess.run = verbose_run
          suite = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_pip_install_integration"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
            echo "status=$?"
          } 2>&1 | tee pip-integration-diagnostic.log
          exit 0
      - name: Upload pip integration diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pip-integration-diagnostic
          path: |
            pip-integration-diagnostic.log
            tests/test_pip_install_integration.py
