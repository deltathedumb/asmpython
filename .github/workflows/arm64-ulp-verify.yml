name: Verify ARM64 math.ulp

on:
  push:
    branches: ["beta/3.14.0"]
    paths:
      - "asmpython/_backends/arm64/source_build.py"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_float_ulp.py"
      - "asmpython/_runtime/abi_float_ulp_linux_arm64.S"
      - "tests/test_arm64_float_ulp.py"
      - ".github/workflows/arm64-ulp-verify.yml"
  pull_request:
    paths:
      - "asmpython/_backends/arm64/source_build.py"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_float_ulp.py"
      - "asmpython/_runtime/abi_float_ulp_linux_arm64.S"
      - "tests/test_arm64_float_ulp.py"
      - ".github/workflows/arm64-ulp-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AArch64 binutils and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user
      - name: Run exact reference and source-surface tests
        run: python -m unittest -v tests.test_arm64_float_ulp
      - name: Execute exact ULP probe through QEMU
        run: python -m asmpython._backends.arm64._verify_float_ulp --mode cross

  native-verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - name: Run exact reference and source-surface tests
        run: python -m unittest -v tests.test_arm64_float_ulp
      - name: Execute exact ULP probe natively
        run: python -m asmpython._backends.arm64._verify_float_ulp --mode native
