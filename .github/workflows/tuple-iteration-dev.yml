name: Develop tuple iteration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'beta/3.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm gcc binutils file
      - name: Apply implementation
        run: python .github/dev/apply_tuple_iteration.py
      - name: Verify source and runtime object
        run: |
          python -m py_compile \
            asmpython/_compiler/ir_lower.py \
            tests/test_tuple_iteration_lowering.py
          python -m unittest -v tests.test_tuple_iteration_lowering
          nasm -f elf64 -w-label-redef-late \
            asmpython/_runtime/abi_shims_linux.asm -o /tmp/abi_shims_linux.o
          nm -g /tmp/abi_shims_linux.o | grep ' _abi_float_to_str$'
      - name: Capture tuple executable diagnostics
        run: |
          set +e
          : > tuple-diagnostic.log
          {
            echo '=== build ==='
            python -m asmpython tests/cases/63_tuple_unpack.py \
              --backend x86-64 --no-pyinbin-fallback -o /tmp/tuple_unpack
            build_status=$?
            echo "build_status=$build_status"
            if [ "$build_status" -eq 0 ]; then
              ls -l /tmp/tuple_unpack
              file /tmp/tuple_unpack
              echo '=== execute ==='
              /tmp/tuple_unpack > tuple.out 2> tuple.err
              run_status=$?
              echo "run_status=$run_status"
              echo '=== stdout ==='
              cat tuple.out
              echo '=== stdout bytes ==='
              od -An -tx1c tuple.out
              echo '=== stderr ==='
              cat tuple.err
              printf '1\n2\nlabel: a\nn: 5\n1.5\n2.5\n0\n1\n2\nsum: 3\n' > tuple.expected
              echo '=== diff ==='
              diff -u tuple.expected tuple.out
              echo "diff_status=$?"
              echo '=== symbols ==='
              nm -n /tmp/tuple_unpack | grep -E '_abi_float_to_str|_runtime_str_concat_dup| main$' || true
            fi
          } 2>&1 | tee tuple-diagnostic.log
          exit 0
      - name: Upload tuple diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tuple-runtime-diagnostic
          path: |
            tuple-diagnostic.log
            tuple.out
            tuple.err
            tuple.expected
            asmpython/_compiler/ir_lower.py
            asmpython/_runtime/abi_shims_linux.asm
            tests/test_tuple_iteration_lowering.py
