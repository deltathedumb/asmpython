name: Develop tuple iteration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'beta/3.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm gcc binutils
      - name: Apply implementation
        run: |
          python .github/dev/apply_tuple_iteration.py
          python .github/dev/apply_linux_executable_output.py
      - name: Verify source and runtime
        run: |
          python -m py_compile \
            asmpython/_compiler/ir_lower.py \
            asmpython/_compiler/driver.py \
            tests/test_tuple_iteration_lowering.py \
            tests/test_driver_output_permissions.py
          python -m unittest -v \
            tests.test_tuple_iteration_lowering \
            tests.test_driver_output_permissions
          nasm -f elf64 -w-label-redef-late \
            asmpython/_runtime/abi_shims_linux.asm -o /tmp/abi_shims_linux.o
          nm -g /tmp/abi_shims_linux.o | grep ' _abi_float_to_str$'
      - name: Execute tuple regression
        run: |
          python -m asmpython tests/cases/63_tuple_unpack.py \
            --backend x86-64 --no-pyinbin-fallback -o /tmp/tuple_unpack
          test -x /tmp/tuple_unpack
          /tmp/tuple_unpack > /tmp/tuple.out
          printf '1\n2\nlabel: a\nn: 5\n1.5\n2.5\n0\n1\n2\nsum: 3\n' > /tmp/tuple.expected
          diff -u /tmp/tuple.expected /tmp/tuple.out
      - name: Commit verified implementation
        run: |
          git config user.name "asmpython-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            asmpython/_compiler/ir_lower.py \
            asmpython/_compiler/driver.py \
            asmpython/_runtime/abi_shims_linux.asm \
            tests/test_tuple_iteration_lowering.py \
            tests/test_driver_output_permissions.py
          git commit -m "Add homogeneous tuple iteration on Linux"
          git push origin HEAD:beta/3.14.0
