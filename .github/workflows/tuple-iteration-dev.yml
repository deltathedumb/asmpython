name: Develop tuple iteration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'beta/3.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm gcc binutils
      - name: Implement tuple iteration and Linux float formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          ir_path = Path("asmpython/_compiler/ir_lower.py")
          ir_text = ir_path.read_text(encoding="utf-8")
          old = '''        iter_t = A.expr_type(s.iter)\n        if iter_t not in ("list", "dict", "str", "any"):\n            raise LowerError(f"unsupported stmt For (iterating {iter_t!r})")\n        if iter_t == "dict":\n            el_ty = "str"\n        elif iter_t == "str":\n            el_ty = "str"\n        elif iter_t == "any":\n            el_ty = "any"\n        elif isinstance(s.iter, A.ListLit):\n            el_ty = s.iter.el_type\n'''
          new = '''        iter_t = A.expr_type(s.iter)\n        if iter_t not in ("list", "tuple", "dict", "str", "any"):\n            raise LowerError(f"unsupported stmt For (iterating {iter_t!r})")\n        if iter_t == "dict":\n            el_ty = "str"\n        elif iter_t == "str":\n            el_ty = "str"\n        elif iter_t == "any":\n            el_ty = "any"\n        elif iter_t == "tuple":\n            tuple_types = A.tuple_element_types(s.iter)\n            el_ty = tuple_types[0] if tuple_types else "int"\n        elif isinstance(s.iter, A.ListLit):\n            el_ty = s.iter.el_type\n'''
          if old in ir_text:
              ir_text = ir_text.replace(old, new, 1)
          elif new not in ir_text:
              raise SystemExit("generic iterable dispatch changed")
          old_float = '''        if el_ty == "float":\n            raise LowerError("unsupported stmt For (float list elements)")\n'''
          new_float = '''        if el_ty == "float" and iter_t != "tuple":\n            raise LowerError("unsupported stmt For (float list elements)")\n'''
          if old_float in ir_text:
              ir_text = ir_text.replace(old_float, new_float, 1)
          elif new_float not in ir_text:
              raise SystemExit("float iterable guard changed")
          ir_path.write_text(ir_text, encoding="utf-8")

          asm_path = Path("asmpython/_runtime/abi_shims_linux.asm")
          asm = asm_path.read_text(encoding="utf-8")
          replacements = (
              (
                  "extern _runtime_str_concat\n",
                  "extern _runtime_str_concat\nextern _runtime_str_concat_dup\n",
              ),
              ("extern strtoll\n", "extern strtoll\nextern strtod\n"),
              (
                  "global _abi_str_to_int_base\n",
                  "global _abi_str_to_int_base\nglobal _abi_float_to_str\n",
              ),
              (
                  "_con_buf:   resb 32\n",
                  "_con_buf:   resb 32\n"
                  "_abi_fmt_fixed_buf: resb 8\n"
                  "_abi_fmt_sci_buf:   resb 8\n"
                  "_abi_float_search_buf: resb 40\n",
              ),
              (
                  "_con_fmt_s:      db \"%s\", 0\n",
                  "_con_fmt_s:      db \"%s\", 0\n"
                  "_abi_str_nan:    db \"nan\", 0\n"
                  "_abi_str_pinf:   db \"inf\", 0\n"
                  "_abi_str_ninf:   db \"-inf\", 0\n",
              ),
          )
          for before, after in replacements:
              if before in asm:
                  asm = asm.replace(before, after, 1)
              elif after not in asm:
                  raise SystemExit(f"Linux shim insertion point changed: {before!r}")

          helper = r'''
; rax = float_to_str(xmm0) -> a fresh nul-terminated Python-style float
; representation. Search the minimum fixed/scientific precision whose text
; round-trips through strtod to the exact original IEEE-754 bits. This is the
; SysV port of the Windows runtime's shortest-roundtrip formatter.
_abi_float_to_str:
    ; SysV entry rsp % 16 == 8. Two pushes keep it at 8; subtracting 40
    ; aligns rsp to 16 before every libc/runtime call below.
    push rbx
    push r12
    sub rsp, 40

    ucomisd xmm0, xmm0
    jp .float_is_nan
    movq rax, xmm0
    mov r10, 0x7FFFFFFFFFFFFFFF
    and rax, r10
    mov r10, 0x7FF0000000000000
    cmp rax, r10
    jne .float_finite
    movq rax, xmm0
    test rax, rax
    jns .float_pos_inf
    lea rax, [_abi_str_ninf]
    jmp .float_done
.float_pos_inf:
    lea rax, [_abi_str_pinf]
    jmp .float_done
.float_is_nan:
    lea rax, [_abi_str_nan]
    jmp .float_done

.float_finite:
    ; rsp+0  = original double
    ; rsp+8  = notation flag: 0 fixed, 1 scientific
    ; rsp+16 = current precision
    movsd [rsp], xmm0
    movq rax, xmm0
    mov r10, 0x7FFFFFFFFFFFFFFF
    and rax, r10
    movq xmm1, rax
    xorpd xmm2, xmm2
    ucomisd xmm1, xmm2
    je .float_notation_fixed
    mov r10, 0x3F1A36E2EB1C432D
    movq xmm3, r10
    ucomisd xmm1, xmm3
    jb .float_notation_sci
    mov r10, 0x4341C37937E08000
    movq xmm3, r10
    ucomisd xmm1, xmm3
    jae .float_notation_sci
.float_notation_fixed:
    mov qword [rsp+8], 0
    jmp .float_search_init
.float_notation_sci:
    mov qword [rsp+8], 1

.float_search_init:
    xor r12d, r12d
.float_search_loop:
    mov [rsp+16], r12
    cmp qword [rsp+8], 0
    je .float_use_fixed_fmt
    lea rbx, [_abi_fmt_sci_buf]
    mov byte [rbx], '%'
    mov byte [rbx+1], '.'
    jmp .float_fmt_digits
.float_use_fixed_fmt:
    lea rbx, [_abi_fmt_fixed_buf]
    mov byte [rbx], '%'
    mov byte [rbx+1], '.'
.float_fmt_digits:
    mov rax, r12
    mov r10, 10
    xor edx, edx
    div r10
    test rax, rax
    jz .float_one_digit
    add al, '0'
    mov [rbx+2], al
    add dl, '0'
    mov [rbx+3], dl
    lea rcx, [rbx+4]
    jmp .float_fmt_kind
.float_one_digit:
    add dl, '0'
    mov [rbx+2], dl
    lea rcx, [rbx+3]
.float_fmt_kind:
    cmp qword [rsp+8], 0
    je .float_fmt_fixed
    mov byte [rcx], 'e'
    mov byte [rcx+1], 0
    jmp .float_fmt_ready
.float_fmt_fixed:
    mov byte [rcx], 'f'
    mov byte [rcx+1], 0
.float_fmt_ready:
    ; SysV variadic ABI: one vector argument is live in xmm0, so AL=1.
    movsd xmm0, [rsp]
    lea rdi, [_abi_float_search_buf]
    mov rsi, rbx
    mov eax, 1
    call sprintf

    lea rdi, [_abi_float_search_buf]
    xor esi, esi
    call strtod
    movq rax, xmm0
    movsd xmm1, [rsp]
    movq r10, xmm1
    mov r12, [rsp+16]
    cmp rax, r10
    je .float_search_done
    inc r12
    cmp r12, 17
    jbe .float_search_loop

.float_search_done:
    lea rax, [_abi_float_search_buf]
    ; Normalize any over-padded exponent while retaining at least two digits.
    mov rbx, rax
.float_exp_scan:
    mov cl, [rbx]
    test cl, cl
    jz .float_no_exp
    cmp cl, 'e'
    je .float_found_exp
    inc rbx
    jmp .float_exp_scan
.float_found_exp:
    lea rsi, [rbx+2]
    mov rdi, rsi
.float_skip_zeros:
    mov cl, [rdi]
    cmp cl, '0'
    jne .float_zeros_done
    lea rdx, [rdi+1]
    cmp byte [rdx], 0
    je .float_zeros_done
    mov r10, rdi
.float_count_rest:
    cmp byte [r10], 0
    je .float_count_done
    inc r10
    jmp .float_count_rest
.float_count_done:
    sub r10, rdi
    cmp r10, 2
    jle .float_zeros_done
    inc rdi
    jmp .float_skip_zeros
.float_zeros_done:
    cmp rdi, rsi
    je .float_no_exp
.float_shift_exp:
    mov cl, [rdi]
    mov [rsi], cl
    test cl, cl
    jz .float_no_exp
    inc rdi
    inc rsi
    jmp .float_shift_exp

.float_no_exp:
    lea rax, [_abi_float_search_buf]
    ; Fixed integral output needs Python's explicit decimal marker: 2.0.
    mov rbx, rax
.float_scan_marker:
    mov cl, [rbx]
    test cl, cl
    jz .float_append_point_zero
    cmp cl, '.'
    je .float_fixup_done
    cmp cl, 'e'
    je .float_fixup_done
    inc rbx
    jmp .float_scan_marker
.float_append_point_zero:
    mov byte [rbx], '.'
    mov byte [rbx+1], '0'
    mov byte [rbx+2], 0
.float_fixup_done:
    lea rax, [_abi_float_search_buf]

.float_done:
    ; Runtime string values must be owned, not aliases into this shared buffer.
    call _runtime_str_concat_dup
    add rsp, 40
    pop r12
    pop rbx
    ret

'''
          marker = "; ---- asmlib.hardware: ring-0-only ops, stubbed (unavailable to ring-3\n"
          if "_abi_float_to_str:" not in asm:
              if marker not in asm:
                  raise SystemExit("Linux helper insertion marker changed")
              asm = asm.replace(marker, helper + marker, 1)
          asm_path.write_text(asm, encoding="utf-8")

          Path("tests/test_tuple_iteration_lowering.py").write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom asmpython._compiler import ir_lower\nfrom asmpython._compiler.errors import SemaError\nfrom asmpython._compiler.lexer import Lexer\nfrom asmpython._compiler.parser import Parser\nfrom asmpython._compiler.sema import analyze as sema_analyze\n\n\ndef _lower(source: str):\n    module = Parser(Lexer(source).tokenize(), frozenset()).parse()\n    sema_analyze(module)\n    return ir_lower.lower_module(module)\n\n\ndef _instructions(module):\n    return [\n        instr\n        for func in module.funcs\n        for block in func.blocks\n        for instr in block.instrs\n    ]\n\n\nclass TupleIterationLoweringTests(unittest.TestCase):\n    def test_homogeneous_int_tuple_uses_list_header_iteration(self) -> None:\n        lowered = _lower(\n            "nums = (0, 1, 2)\\n"\n            "total = 0\\n"\n            "for value in nums:\\n"\n            "    total += value\\n"\n        )\n        instructions = _instructions(lowered)\n        self.assertTrue(any(instr.op == "gep" and instr.operands[-1] == 8 for instr in instructions))\n        self.assertTrue(any(instr.op == "gep" and instr.operands[-1] == 16 for instr in instructions))\n\n    def test_homogeneous_float_tuple_loads_float_cells(self) -> None:\n        lowered = _lower(\n            "nums = (1.5, 2.5)\\n"\n            "total = 0.0\\n"\n            "for value in nums:\\n"\n            "    total += value\\n"\n        )\n        loads = [\n            instr\n            for instr in _instructions(lowered)\n            if instr.op == "load" and instr.result is not None\n        ]\n        self.assertTrue(any(instr.result.type.name == "f64" for instr in loads))\n\n    def test_heterogeneous_tuple_iteration_remains_rejected(self) -> None:\n        with self.assertRaisesRegex(SemaError, "heterogeneous tuple"):\n            _lower(\n                "items = (1, \\\"two\\\")\\n"\n                "for item in items:\\n"\n                "    print(item)\\n"\n            )\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY
      - name: Verify source and runtime
        run: |
          python -m py_compile asmpython/_compiler/ir_lower.py tests/test_tuple_iteration_lowering.py
          python -m unittest -v tests.test_tuple_iteration_lowering
          nasm -f elf64 -w-label-redef-late \
            asmpython/_runtime/abi_shims_linux.asm -o /tmp/abi_shims_linux.o
          nm -g /tmp/abi_shims_linux.o | grep ' _abi_float_to_str$'
      - name: Execute tuple regression
        run: |
          python -m asmpython tests/cases/63_tuple_unpack.py \
            --backend x86-64 --no-pyinbin-fallback -o /tmp/tuple_unpack
          /tmp/tuple_unpack > /tmp/tuple.out
          printf '1\n2\nlabel: a\nn: 5\n1.5\n2.5\n0\n1\n2\nsum: 3\n' > /tmp/tuple.expected
          diff -u /tmp/tuple.expected /tmp/tuple.out
      - name: Commit verified implementation
        run: |
          git config user.name "asmpython-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            asmpython/_compiler/ir_lower.py \
            asmpython/_runtime/abi_shims_linux.asm \
            tests/test_tuple_iteration_lowering.py
          git commit -m "Add homogeneous tuple iteration on Linux"
          git push origin HEAD:beta/3.14.0
