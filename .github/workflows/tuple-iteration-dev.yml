name: Develop tuple iteration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'beta/3.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm gcc binutils
      - name: Apply tuple iteration patch in workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("asmpython/_compiler/ir_lower.py")
          text = path.read_text(encoding="utf-8")
          old = '''        iter_t = A.expr_type(s.iter)\n        if iter_t not in ("list", "dict", "str", "any"):\n            raise LowerError(f"unsupported stmt For (iterating {iter_t!r})")\n        if iter_t == "dict":\n            el_ty = "str"\n        elif iter_t == "str":\n            el_ty = "str"\n        elif iter_t == "any":\n            el_ty = "any"\n        elif isinstance(s.iter, A.ListLit):\n            el_ty = s.iter.el_type\n'''
          new = '''        iter_t = A.expr_type(s.iter)\n        if iter_t not in ("list", "tuple", "dict", "str", "any"):\n            raise LowerError(f"unsupported stmt For (iterating {iter_t!r})")\n        if iter_t == "dict":\n            el_ty = "str"\n        elif iter_t == "str":\n            el_ty = "str"\n        elif iter_t == "any":\n            el_ty = "any"\n        elif iter_t == "tuple":\n            tuple_types = A.tuple_element_types(s.iter)\n            el_ty = tuple_types[0] if tuple_types else "int"\n        elif isinstance(s.iter, A.ListLit):\n            el_ty = s.iter.el_type\n'''
          if old not in text:
              raise SystemExit("generic iterable dispatch changed")
          text = text.replace(old, new, 1)
          old_float = '''        if el_ty == "float":\n            raise LowerError("unsupported stmt For (float list elements)")\n'''
          new_float = '''        if el_ty == "float" and iter_t != "tuple":\n            raise LowerError("unsupported stmt For (float list elements)")\n'''
          if old_float not in text:
              raise SystemExit("float iterable guard changed")
          path.write_text(text.replace(old_float, new_float, 1), encoding="utf-8")

          Path("tests/test_tuple_iteration_lowering.py").write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom asmpython._compiler import ir_lower\nfrom asmpython._compiler.errors import SemaError\nfrom asmpython._compiler.lexer import Lexer\nfrom asmpython._compiler.parser import Parser\nfrom asmpython._compiler.sema import analyze as sema_analyze\n\n\ndef _lower(source: str):\n    module = Parser(Lexer(source).tokenize(), frozenset()).parse()\n    sema_analyze(module)\n    return ir_lower.lower_module(module)\n\n\ndef _instructions(module):\n    return [\n        instr\n        for func in module.funcs\n        for block in func.blocks\n        for instr in block.instrs\n    ]\n\n\nclass TupleIterationLoweringTests(unittest.TestCase):\n    def test_homogeneous_int_tuple_uses_list_header_iteration(self) -> None:\n        lowered = _lower(\n            "nums = (0, 1, 2)\\n"\n            "total = 0\\n"\n            "for value in nums:\\n"\n            "    total += value\\n"\n            "print(total)\\n"\n        )\n        instructions = _instructions(lowered)\n        self.assertTrue(any(instr.op == "gep" and instr.operands[-1] == 8 for instr in instructions))\n        self.assertTrue(any(instr.op == "gep" and instr.operands[-1] == 16 for instr in instructions))\n\n    def test_homogeneous_float_tuple_loads_float_cells(self) -> None:\n        lowered = _lower(\n            "nums = (1.5, 2.5)\\n"\n            "total = 0.0\\n"\n            "for value in nums:\\n"\n            "    total += value\\n"\n        )\n        loads = [\n            instr\n            for instr in _instructions(lowered)\n            if instr.op == "load" and instr.result is not None\n        ]\n        self.assertTrue(any(instr.result.type.name == "f64" for instr in loads))\n\n    def test_heterogeneous_tuple_iteration_remains_rejected(self) -> None:\n        with self.assertRaisesRegex(SemaError, "heterogeneous tuple"):\n            _lower(\n                "items = (1, \\\"two\\\")\\n"\n                "for item in items:\\n"\n                "    print(item)\\n"\n            )\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY
      - name: Run tuple lowering tests
        run: |
          python -m py_compile asmpython/_compiler/ir_lower.py tests/test_tuple_iteration_lowering.py
          python -m unittest -v tests.test_tuple_iteration_lowering
      - name: Build and execute real tuple-unpack case
        run: |
          set +e
          python -m asmpython tests/cases/63_tuple_unpack.py \
            --backend x86-64 --no-pyinbin-fallback -o /tmp/tuple_unpack \
            > tuple-build.log 2>&1
          build_status=$?
          echo "build_status=$build_status" | tee tuple-status.log
          if [ "$build_status" -eq 0 ]; then
            /tmp/tuple_unpack > tuple-run.log 2>&1
            echo "run_status=$?" >> tuple-status.log
          fi
          cat tuple-build.log
          cat tuple-status.log
          cat tuple-run.log 2>/dev/null || true
          exit 0
      - name: Upload tuple development result
        uses: actions/upload-artifact@v4
        with:
          name: tuple-iteration-development
          path: |
            asmpython/_compiler/ir_lower.py
            tests/test_tuple_iteration_lowering.py
            tuple-build.log
            tuple-status.log
            tuple-run.log
