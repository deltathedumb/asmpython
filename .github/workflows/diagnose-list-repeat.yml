name: Verify Linux list-repeat ABI

on:
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm
      - name: Run focused codegen regression
        run: python -m pytest -q tests/test_linux_list_repeat_codegen.py
      - name: Compile and execute a large repeated list
        shell: bash
        run: |
          cat > /tmp/list_repeat_probe.py <<'PY'
          def main() -> int:
              values = [0] * 4097
              values[0] = 11
              values[4096] = 31
              print(len(values), values[0] + values[4096])
              return 0
          PY
          python -m asmpython build /tmp/list_repeat_probe.py \
            --target linux --backend legacy --no-pyinbin-fallback \
            -o /tmp/list_repeat_probe.elf
          /tmp/list_repeat_probe.elf | tee /tmp/list-repeat-output.txt
          grep -qx '4097 42' /tmp/list-repeat-output.txt
