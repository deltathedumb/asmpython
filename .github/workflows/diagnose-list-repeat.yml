name: Locate list-repeat ABI emitter

on:
  push:
    branches: [beta]
    paths:
      - ".github/workflows/diagnose-list-repeat.yml"
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate source and tests
        shell: bash
        run: |
          {
            echo '=== runtime-list-repeat names ==='
            grep -R -n -E '_runtime_list_repeat|list_repeat|emit_list_repeat' asmpython tests || true
            echo '=== suspicious hard-coded allocation registers ==='
            grep -R -n -E 'mov rcx, (24|32)|call malloc' asmpython/_compiler || true
          } | tee list-repeat-locations.txt
      - uses: actions/upload-artifact@v4
        with:
          name: list-repeat-locations
          path: list-repeat-locations.txt
