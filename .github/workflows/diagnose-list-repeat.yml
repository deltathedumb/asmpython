name: Verify Linux list-repeat ABI

on:
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm
      - name: Run focused codegen regression
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostics
          set -o pipefail
          python -m pytest -q tests/test_linux_list_repeat_codegen.py \
            2>&1 | tee diagnostics/pytest.log
      - name: Compile and execute a large repeated list
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostics
          cat > /tmp/list_repeat_probe.py <<'PY'
          def main() -> int:
              values = [0] * 4097
              values[0] = 11
              values[4096] = 31
              print(len(values), values[0] + values[4096])
              return 0
          PY
          set -o pipefail
          {
            python -m asmpython build /tmp/list_repeat_probe.py \
              --target linux --backend legacy --no-pyinbin-fallback \
              -o /tmp/list_repeat_probe.elf
            /tmp/list_repeat_probe.elf | tee diagnostics/output.txt
            grep -qx '4097 42' diagnostics/output.txt
          } 2>&1 | tee diagnostics/execution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: list-repeat-verification
          path: diagnostics
      - name: Propagate verification failure
        if: steps.focused.outcome == 'failure' || steps.execute.outcome == 'failure'
        run: exit 1
