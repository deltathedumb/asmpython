name: Apply project-root import resolution fix

on:
  push:
    branches: [beta/3.14.0]
    paths:
      - ".github/workflows/apply-project-root-import-fix.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Generalize project-root and absolute-import resolution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("asmpython/_compiler/program.py")
          text = path.read_text(encoding="utf-8")

          old_absolute = '''def _resolve_absolute(module: str, root: Path) -> Path | None:
              """Resolve an absolute dotted import (`asmpython._compiler.errors`) to a
              project file under `root`'s parent, or None if it's not a project module."""
              parts = module.split(".")
              # The project root dir is named after the top package (e.g. `asmpython`),
              # so an import `asmpython.x.y` maps to <root>/x/y.py with root.name == parts[0].
              if not parts:
                  return None
              if parts[0] != root.name:
                  return None
              target = root
              for part in parts[1:]:
                  target = target / part
              py = Path(str(target) + ".py")
              if py.is_file():
                  return py
              # A package import (`asmpython._compiler`) -> its __init__.py.
              init = target / "__init__.py"
              if init.is_file():
                  return init
              return None
          '''

          new_absolute = '''def _resolve_absolute(module: str, root: Path) -> Path | None:
              """Resolve an absolute dotted import inside a project's source root.

              `root` may be either a package directory itself (`.../asmpython`) or a
              workspace/repository directory containing multiple top-level packages
              (`.../somnia`, `.../tests`, and so on). Only files contained by `root`
              are accepted, so normal stdlib and third-party imports remain external.
              """
              parts = module.split(".")
              if not parts:
                  return None

              if root.name == parts[0]:
                  target = root
              else:
                  target = root / parts[0]
              for part in parts[1:]:
                  target = target / part

              py = Path(str(target) + ".py")
              if py.is_file() and _within(py, root):
                  return py
              init = target / "__init__.py"
              if init.is_file() and _within(init, root):
                  return init
              return None
          '''

          old_root = '''def _project_root(entry: Path) -> Path:
              """The top-level package directory: walk up while a parent has __init__.py
              so the whole `asmpython/` tree counts as one project."""
              root = entry.parent
              while (root.parent / "__init__.py").is_file() or (root / "__init__.py").is_file():
                  if (root.parent / "__init__.py").is_file():
                      root = root.parent
                  else:
                      break
              return root
          '''

          new_root = '''def _project_root(entry: Path) -> Path:
              """Find the source root that owns an entry file.

              First discover the entry's top-level package as before. Then walk toward
              the filesystem root looking for an ordinary project/workspace marker.
              This lets an entry nested under one package import sibling top-level
              packages from the same repository, matching CPython's project-root
              behavior, while preserving the old package-root fallback for loose or
              installed source trees without a marker.
              """
              package_root = entry.parent
              while (
                  (package_root.parent / "__init__.py").is_file()
                  or (package_root / "__init__.py").is_file()
              ):
                  if (package_root.parent / "__init__.py").is_file():
                      package_root = package_root.parent
                  else:
                      break

              current = package_root
              while True:
                  if (
                      (current / "pyproject.toml").is_file()
                      or (current / "setup.cfg").is_file()
                      or (current / "setup.py").is_file()
                      or (current / "project.json").is_file()
                      or (current / ".git").is_dir()
                  ):
                      return current
                  parent = current.parent
                  if parent == current:
                      break
                  current = parent
              return package_root
          '''

          if old_absolute not in text:
              raise SystemExit("expected _resolve_absolute implementation was not found")
          if old_root not in text:
              raise SystemExit("expected _project_root implementation was not found")

          text = text.replace(old_absolute, new_absolute, 1)
          text = text.replace(old_root, new_root, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Compile and run focused sibling-package regression
        run: |
          python -m asmpython tests/cases/463_sibling_project_package.py \
            --target linux -o /tmp/asmpython-sibling-package
          output=$(/tmp/asmpython-sibling-package)
          printf '%s\n' "$output"
          test "$output" = "42"
      - name: Commit verified compiler fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-project-root-import-fix.yml
          git add asmpython/_compiler/program.py
          git commit -m "Resolve sibling top-level project packages"
          git push origin HEAD:beta/3.14.0
