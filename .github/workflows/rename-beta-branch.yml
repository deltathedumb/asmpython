name: Rename beta branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    if: github.head_ref == 'beta'
    runs-on: ubuntu-24.04
    steps:
      - name: Safely migrate beta ref to beta/3.14.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BETA_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          backup_name='__beta_314_rename_backup'
          target_name='beta/3.14.0'

          retry() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          if ! gh api "repos/$REPOSITORY/git/ref/heads/$backup_name" --silent; then
            retry gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/heads/$backup_name" -f sha="$BETA_SHA"
          fi

          if gh api "repos/$REPOSITORY/git/ref/heads/beta" --silent; then
            retry gh api --method DELETE \
              "repos/$REPOSITORY/git/refs/heads/beta"
          fi

          if ! gh api "repos/$REPOSITORY/git/ref/heads/$target_name" --silent; then
            if ! retry gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/heads/$target_name" -f sha="$BETA_SHA"; then
              if ! gh api "repos/$REPOSITORY/git/ref/heads/beta" --silent; then
                retry gh api --method POST "repos/$REPOSITORY/git/refs" \
                  -f ref='refs/heads/beta' -f sha="$BETA_SHA" || true
              fi
              exit 1
            fi
          fi

          actual_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/$target_name" --jq '.object.sha')"
          test "$actual_sha" = "$BETA_SHA"

          retry gh api --method DELETE \
            "repos/$REPOSITORY/git/refs/heads/$backup_name"
