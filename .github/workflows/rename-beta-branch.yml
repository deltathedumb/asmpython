name: Cleanup beta branch rename

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'beta/3.14.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary beta rename backup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$REPOSITORY/git/ref/heads/__beta_314_rename_backup" --silent; then
            gh api --method DELETE \
              "repos/$REPOSITORY/git/refs/heads/__beta_314_rename_backup"
          fi
