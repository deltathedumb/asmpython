name: Align ARM64 test expectations

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'beta/3.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply test alignment
        run: python .github/dev/apply_arm64_test_alignment.py
      - name: Compile aligned tests
        run: |
          python -m py_compile \
            tests/test_arm64_cli.py \
            tests/test_arm64_linux_link.py \
            tests/test_arm64_string_replace.py
      - name: Run complete ARM64 unit discovery
        run: python -m unittest discover -s tests -p 'test_arm64_*.py' -v
      - name: Commit verified test alignment
        run: |
          git config user.name "asmpython-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            tests/test_arm64_cli.py \
            tests/test_arm64_linux_link.py \
            tests/test_arm64_string_replace.py
          git commit -m "Align ARM64 tests with runtime manifest"
          git push origin HEAD:beta/3.14.0
