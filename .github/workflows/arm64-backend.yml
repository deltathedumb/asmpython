name: ARM64 backend verification

on:
  push:
    branches: [beta]
    paths:
      - "asmpython/_backends/arm64/**"
      - "asmpython/_compiler/ir.py"
      - "tests/test_arm64_codegen.py"
      - "tests/test_arm64_elf.py"
      - ".github/workflows/arm64-backend.yml"
  pull_request:
    paths:
      - "asmpython/_backends/arm64/**"
      - "asmpython/_compiler/ir.py"
      - "tests/test_arm64_codegen.py"
      - "tests/test_arm64_elf.py"
      - ".github/workflows/arm64-backend.yml"

permissions:
  contents: read

jobs:
  codegen-and-elf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AArch64 verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu qemu-user
      - name: Compile ARM64 backend modules
        run: |
          python -m py_compile \
            asmpython/_backends/arm64/encoder.py \
            asmpython/_backends/arm64/regalloc.py \
            asmpython/_backends/arm64/codegen.py \
            asmpython/_backends/arm64/elf.py \
            asmpython/_backends/arm64/_verify_elf.py \
            tests/test_arm64_codegen.py \
            tests/test_arm64_elf.py
      - name: Run ARM64 structural tests
        run: |
          python -m unittest \
            tests.test_arm64_codegen \
            tests.test_arm64_elf \
            -v
      - name: Run generated ELF under QEMU
        run: python -m asmpython._backends.arm64._verify_elf
