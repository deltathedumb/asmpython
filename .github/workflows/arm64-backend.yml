name: ARM64 backend smoke

on:
  push:
    branches: [beta]
    paths:
      - "asmpython/_backends/arm64/**"
      - "asmpython/_compiler/ir.py"
      - "tests/test_arm64_codegen.py"
      - ".github/workflows/arm64-backend.yml"
  pull_request:
    paths:
      - "asmpython/_backends/arm64/**"
      - "asmpython/_compiler/ir.py"
      - "tests/test_arm64_codegen.py"
      - ".github/workflows/arm64-backend.yml"

permissions:
  contents: read

jobs:
  codegen-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ARM64 backend modules
        run: |
          python -m py_compile \
            asmpython/_backends/arm64/encoder.py \
            asmpython/_backends/arm64/regalloc.py \
            asmpython/_backends/arm64/codegen.py \
            tests/test_arm64_codegen.py
      - name: Run ARM64 codegen verification
        run: python -m unittest tests.test_arm64_codegen -v
