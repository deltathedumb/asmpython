name: Verify recursive generator lowering

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [beta/3.14.0]

permissions:
  contents: read

jobs:
  recursive-generator:
    if: github.event.pull_request.head.ref == 'fix/somnia-provider-runtime-types-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Record lowered recursive generator
        run: |
          python - <<'PY' > recursive-generator-ast.txt
          from pathlib import Path
          from asmpython._compiler.driver import _compile_program

          path = Path("tests/cases/471_recursive_generator_only.py")
          module = _compile_program(
              path.read_text(encoding="utf-8"),
              source_dir=path.parent,
              entry_path=path,
              whole_program=False,
              all_errors=False,
          )
          for owner in module.classes:
              if owner.name != "Node":
                  continue
              for method in owner.methods:
                  if method.name == "walk":
                      print("ret_type", method.ret_type)
                      print("body", repr(method.body))
          PY
          cat recursive-generator-ast.txt
      - name: Run recursive generator
        id: recursive
        continue-on-error: true
        run: |
          set +e
          {
            python -m asmpython tests/cases/471_recursive_generator_only.py --target linux -o /tmp/asmpython-recursive-generator
            compile_status=$?
            echo "compile_status=$compile_status"
            if [ "$compile_status" -eq 0 ] && [ -x /tmp/asmpython-recursive-generator ]; then
              output=$(/tmp/asmpython-recursive-generator)
              native_status=$?
              printf '%s\n' "$output"
              echo "native_status=$native_status"
              if [ "$output" = '2' ]; then
                output_status=0
              else
                output_status=2
              fi
            else
              native_status=99
              output_status=99
            fi
            exit_status=$compile_status
            if [ "$exit_status" -eq 0 ]; then
              exit_status=$native_status
            fi
            if [ "$exit_status" -eq 0 ]; then
              exit_status=$output_status
            fi
            echo "exit_status=$exit_status"
          } > recursive-generator.txt 2>&1
          cat recursive-generator.txt
          exit "$(sed -n 's/^exit_status=//p' recursive-generator.txt | tail -n 1)"
      - name: Upload recursive generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursive-generator-diagnostic
          path: |
            recursive-generator-ast.txt
            recursive-generator.txt
          retention-days: 7
      - name: Require recursive generator
        if: steps.recursive.outcome != 'success'
        run: exit 1
