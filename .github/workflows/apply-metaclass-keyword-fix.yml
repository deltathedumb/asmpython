name: Verify metaclass keyword parsing

on:
  pull_request:
    branches: [beta/3.14.0]
    paths:
      - "asmpython/_compiler/ast_nodes.py"
      - "asmpython/_compiler/parser.py"
      - "tests/cases/464_metaclass_keyword.py"
      - ".github/workflows/verify-somnia-metaclass-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Apply metaclass keyword support when absent
        run: |
          python - <<'PY'
          from pathlib import Path

          ast_path = Path("asmpython/_compiler/ast_nodes.py")
          ast = ast_path.read_text(encoding="utf-8")
          if '    metaclass: "str | None" = None\n' not in ast:
              field = '    implements_interface: "str | None" = None\n'
              if field not in ast:
                  raise SystemExit("ClassDef field anchor not found")
              ast = ast.replace(
                  field,
                  field + '    # Explicit Python class-header metaclass.\n'
                  '    metaclass: "str | None" = None\n',
                  1,
              )
              ast_path.write_text(ast, encoding="utf-8")

          parser_path = Path("asmpython/_compiler/parser.py")
          parser = parser_path.read_text(encoding="utf-8")
          if '        metaclass_name: "str | None" = None\n' not in parser:
              variable = '        implements_interface: "str | None" = None\n'
              if variable not in parser:
                  raise SystemExit("class parser variable anchor not found")
              parser = parser.replace(
                  variable,
                  variable + '        metaclass_name: "str | None" = None\n',
                  1,
              )

              first_marker = (
                  '                else:\n'
                  '                    # First base class, possibly dotted (`module.Base`). Every\n'
              )
              if first_marker not in parser:
                  raise SystemExit("first class-base landmark not found")
              parser = parser.replace(
                  first_marker,
                  '                elif (\n'
                  '                    self._check("NAME", "metaclass")\n'
                  '                    and self._peek(1).kind == "OP"\n'
                  '                    and self._peek(1).value == "="\n'
                  '                ):\n'
                  '                    self._eat()\n'
                  '                    self._eat()\n'
                  '                    metaclass_name = self._expect("NAME").value\n'
                  '                    while self._check("OP", "."):\n'
                  '                        self._eat()\n'
                  '                        metaclass_name = self._expect("NAME").value\n'
                  + first_marker,
                  1,
              )

              extra_marker = (
                  '                    self._parse_expr()\n'
                  '            self._expect("OP", ")")\n'
              )
              if extra_marker not in parser:
                  raise SystemExit("extra class-base landmark not found")
              parser = parser.replace(
                  extra_marker,
                  '                    if (\n'
                  '                        self._check("NAME", "metaclass")\n'
                  '                        and self._peek(1).kind == "OP"\n'
                  '                        and self._peek(1).value == "="\n'
                  '                    ):\n'
                  '                        self._eat()\n'
                  '                        self._eat()\n'
                  '                        metaclass_name = self._expect("NAME").value\n'
                  '                        while self._check("OP", "."):\n'
                  '                            self._eat()\n'
                  '                            metaclass_name = self._expect("NAME").value\n'
                  '                        continue\n'
                  + extra_marker,
                  1,
              )

              return_marker = (
                  '            implements_interface=implements_interface,\n'
                  '        )\n'
              )
              if return_marker not in parser:
                  raise SystemExit("ClassDef return landmark not found")
              parser = parser.replace(
                  return_marker,
                  '            implements_interface=implements_interface,\n'
                  '            metaclass=metaclass_name,\n'
                  '        )\n',
                  1,
              )
              parser_path.write_text(parser, encoding="utf-8")
          PY
      - name: Compile and run focused regression
        run: |
          python -m asmpython tests/cases/464_metaclass_keyword.py \
            --target linux -o /tmp/asmpython-metaclass-keyword
          output=$(/tmp/asmpython-metaclass-keyword)
          printf '%s\n' "$output"
          test "$output" = "42"
      - name: Commit materialized source changes
        run: |
          if git diff --quiet -- asmpython/_compiler/ast_nodes.py asmpython/_compiler/parser.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asmpython/_compiler/ast_nodes.py asmpython/_compiler/parser.py
          git commit -m "Parse class metaclass keyword arguments"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
