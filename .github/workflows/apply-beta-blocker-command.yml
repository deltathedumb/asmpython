name: Apply beta blocker command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.issue.pull_request && github.event.comment.body == '/apply-asmpython-blocker' && (github.event.issue.number == 25 || github.event.issue.number == 26 || github.event.issue.number == 37)
    runs-on: ubuntu-24.04
    steps:
      - name: Select target branch
        id: target
        run: |
          if [ "${{ github.event.issue.number }}" = "25" ]; then
            echo "branch=fix/yield-from-final" >> "$GITHUB_OUTPUT"
            echo "kind=yield" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.issue.number }}" = "26" ]; then
            echo "branch=fix/call-expression-result-final" >> "$GITHUB_OUTPUT"
            echo "kind=call" >> "$GITHUB_OUTPUT"
          else
            echo "branch=fix/somnia-provider-runtime-types" >> "$GITHUB_OUTPUT"
            echo "kind=provider" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Apply yield-from support
        if: steps.target.outputs.kind == 'yield'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("asmpython/_compiler/parser.py")
          text = path.read_text(encoding="utf-8")
          counter = '        self._yield_from_counter = 0\n'
          if counter not in text:
              anchor = '        self._deco_tmp_counter = 0\n'
              if anchor not in text:
                  raise SystemExit("parser counter anchor not found")
              text = text.replace(anchor, anchor + counter, 1)
          signature = 'item_name = "__yield_from_" + str(self._yield_from_counter)'
          if signature not in text:
              start_marker = '            if t.value == "yield":\n'
              end_marker = '\n\n        # `match` is a soft keyword'
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit("yield parser branch landmarks not found")
              branch = '''            if t.value == "yield":
                  pos = self._eat().pos
                  if self._check("KEYWORD", "from"):
                      self._eat()
                      iterable = self._parse_expr()
                      self._expect("NEWLINE")
                      self._yield_from_counter += 1
                      item_name = "__yield_from_" + str(self._yield_from_counter)
                      return A.For(
                          var=item_name,
                          range_args=[],
                          iter=iterable,
                          body=[A.YieldStmt(value=A.Name(name=item_name, pos=pos), pos=pos)],
                          pos=pos,
                      )
                  if self._check("NEWLINE"):
                      val: A.Expr = A.IntLit(value=0, pos=pos)
                  else:
                      val = self._parse_expr()
                  self._expect("NEWLINE")
                  return A.YieldStmt(value=val, pos=pos)
'''
              text = text[:start] + branch + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Test yield-from support
        if: steps.target.outputs.kind == 'yield'
        run: |
          python -m asmpython tests/cases/467_yield_from.py --target linux -o /tmp/asmpython-yield-from
          output=$(/tmp/asmpython-yield-from)
          printf '%s\n' "$output"
          test "$output" = $'1\n2'
      - name: Apply expression-result-call support
        if: steps.target.outputs.kind == 'call'
        run: |
          python - <<'PY'
          from pathlib import Path
          parser_path = Path("asmpython/_compiler/parser.py")
          parser = parser_path.read_text(encoding="utf-8")
          if 'method="__call__"' not in parser:
              marker = '''                else:
                      # obj.name — attribute access (e.g. math.pi)
                      atom = A.Attr(obj=atom, name=name, pos=dot.pos)  # type: ignore
              else:
                  return atom
'''
              replacement = '''                else:
                      # obj.name — attribute access (e.g. math.pi)
                      atom = A.Attr(obj=atom, name=name, pos=dot.pos)  # type: ignore
              elif self._check("OP", "("):
                  lpar = self._eat()
                  args, kwargs = self._parse_call_args()
                  self._expect("OP", ")")
                  atom = A.MethodCall(obj=atom, method="__call__", args=args, kwargs=kwargs, pos=lpar.pos)
              else:
                  return atom
'''
              if marker not in parser:
                  raise SystemExit("parser trailer landmark not found")
              parser_path.write_text(parser.replace(marker, replacement, 1), encoding="utf-8")
          sema_path = Path("asmpython/_compiler/sema.py")
          sema = sema_path.read_text(encoding="utf-8")
          if 'source_class_name = source_t.split(":", 1)[1]' not in sema:
              marker = '''            self._check_expr(e.obj, scope)
              obj_t = A.expr_type(e.obj)
              # Bind keyword/vararg arguments for user-class (and super) method
'''
              replacement = '''            self._check_expr(e.obj, scope)
              obj_t = A.expr_type(e.obj)
              if (
                  e.method == "__call__"
                  and isinstance(e.obj, A.Call)
                  and e.obj.func == "type"
                  and len(e.obj.args) == 1
              ):
                  source_t = A.expr_type(e.obj.args[0])
                  if source_t.startswith("instance:"):
                      source_class_name = source_t.split(":", 1)[1]
                      e.__class__ = A.Call  # type: ignore[assignment]
                      e.func = source_class_name  # type: ignore[attr-defined]
                      e.dstar = None  # type: ignore[attr-defined]
                      e.resolved_overload_symbol = None  # type: ignore[attr-defined]
                      self._check_call(e, scope)  # type: ignore[arg-type]
                      return
                  if source_t != "any":
                      raise SemaError(
                          "the result of type() is only constructible for a statically known user-class instance",
                          e.pos,
                          ErrorCode.E_NOT_CALLABLE,
                      )
              # Bind keyword/vararg arguments for user-class (and super) method
'''
              if marker not in sema:
                  raise SystemExit("MethodCall semantic landmark not found")
              sema_path.write_text(sema.replace(marker, replacement, 1), encoding="utf-8")
          PY
      - name: Test expression-result calls
        if: steps.target.outputs.kind == 'call'
        run: |
          python -m asmpython tests/cases/466_call_expression_result.py --target linux -o /tmp/asmpython-call-expression
          output=$(/tmp/asmpython-call-expression)
          printf '%s\n' "$output"
          test "$output" = $'42\n43'
      - name: Apply provider runtime type semantics
        if: steps.target.outputs.kind == 'provider'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("asmpython/_compiler/sema.py")
          text = path.read_text(encoding="utf-8")

          old_function_param = '''                    if (
                          annot is None
                          and default is None
                          and inferred is None
                          and p in usage_hints
                      ):
                          scope.add(p, usage_hints[p])
                          continue
                      self._seed_param(scope, p, annot, default, inferred, pos=f.pos)
'''
          new_function_param = '''                    if annot is None and default is None and inferred is None:
                          scope.add(p, usage_hints[p] if p in usage_hints else "any")
                          continue
                      self._seed_param(scope, p, annot, default, inferred, pos=f.pos)
'''
          if old_function_param in text:
              text = text.replace(old_function_param, new_function_param, 1)

          old_method_param = '''                    if (
                          annot is None
                          and default is None
                          and inferred is None
                          and p in usage_hints
                      ):
                          scope.add(p, usage_hints[p])
                          continue
                      self._seed_param(scope, p, annot, default, inferred, pos=m.pos)
'''
          new_method_param = '''                    if annot is None and default is None and inferred is None:
                          scope.add(p, usage_hints[p] if p in usage_hints else "any")
                          continue
                      self._seed_param(scope, p, annot, default, inferred, pos=m.pos)
'''
          if old_method_param in text:
              text = text.replace(old_method_param, new_method_param, 1)

          old_str = '''                if t not in (
                      "int", "float", "str", "any", "list", "tuple", "dict", "set"
                  ) and not t.startswith("instance:"):
'''
          new_str = '''                if t not in (
                      "int", "float", "str", "any", "list", "tuple", "dict", "set", "type"
                  ) and not t.startswith("instance:"):
'''
          if old_str in text:
              text = text.replace(old_str, new_str, 1)

          if 'e.dynamic_type_candidates = candidates' not in text:
              type_start = text.find('''            elif (
                  obj_t == "type"
''')
              if type_start < 0:
                  raise SystemExit("type receiver branch not found")
              insert_at = text.find('                if e.method == "from_bytes":', type_start)
              if insert_at < 0:
                  raise SystemExit("type receiver insertion point not found")
              block = '''                if obj_t == "type":
                      candidates: list = []
                      candidate_ret = None
                      candidate_el = None
                      for dynamic_cls_name in self.classes:
                          dynamic_resolved = self._resolve_method(dynamic_cls_name, e.method)
                          if dynamic_resolved is None:
                              continue
                          dynamic_owner: str = dynamic_resolved[0]
                          dynamic_sig: FuncSig = dynamic_resolved[1]
                          dynamic_decorators: list[str] = getattr(dynamic_sig, "decorators", [])
                          if "classmethod" not in dynamic_decorators and "staticmethod" not in dynamic_decorators:
                              continue
                          dynamic_expected = dynamic_sig.arity - (1 if "classmethod" in dynamic_decorators else 0)
                          dynamic_required = dynamic_expected - dynamic_sig.n_defaults
                          if not (dynamic_required <= len(e.args) <= dynamic_expected):
                              continue
                          candidates.append((dynamic_cls_name, dynamic_owner, "classmethod" in dynamic_decorators))
                          if dynamic_sig.ret_type is not None:
                              dynamic_ret: tuple = dynamic_sig.ret_type  # type: ignore
                              this_ret = dynamic_ret[0]
                              this_el = dynamic_ret[1]
                          else:
                              this_ret = "int"
                              this_el = None
                          if candidate_ret is None:
                              candidate_ret = this_ret
                              candidate_el = this_el
                          elif candidate_ret != this_ret:
                              candidate_ret = "any"
                              candidate_el = None
                      if not candidates:
                          raise SemaError(f"type has no method {e.method!r}", e.pos, ErrorCode.E_NO_METHOD)
                      e.dynamic_type_candidates = candidates  # type: ignore[attr-defined]
                      e.inferred_type = candidate_ret if candidate_ret is not None else "any"
                      if e.inferred_type == "list" and candidate_el is not None:
                          e.list_el_type = candidate_el
                      return
'''
              text = text[:insert_at] + block + text[insert_at:]

          path.write_text(text, encoding="utf-8")
          PY
      - name: Probe provider runtime type support
        if: steps.target.outputs.kind == 'provider'
        continue-on-error: true
        run: |
          set -o pipefail
          python -m asmpython tests/cases/468_provider_type_runtime.py --target linux -o /tmp/provider-type-runtime \
            > provider-runtime-probe.txt 2>&1
          if [ -x /tmp/provider-type-runtime ]; then
            /tmp/provider-type-runtime >> provider-runtime-probe.txt 2>&1
          fi
          cat provider-runtime-probe.txt
      - name: Commit verified source changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.target.outputs.kind }}" = "provider" ]; then
            touch provider-runtime-probe.txt
            git add asmpython/_compiler/sema.py provider-runtime-probe.txt
            if ! git diff --cached --quiet; then
              git commit -m "Add provider class value semantics"
              git push origin HEAD:${{ steps.target.outputs.branch }}
            fi
            exit 0
          fi
          if git diff --quiet -- asmpython/_compiler/parser.py asmpython/_compiler/sema.py; then
            exit 0
          fi
          git add asmpython/_compiler/parser.py asmpython/_compiler/sema.py
          if [ "${{ steps.target.outputs.kind }}" = "yield" ]; then
            git commit -m "Lower yield-from delegation"
          else
            git commit -m "Support calls on expression results"
          fi
          git push origin HEAD:${{ steps.target.outputs.branch }}
