name: Verify yield-from support

on:
  pull_request:
    branches: [beta/3.14.0]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Add yield-from lowering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("asmpython/_compiler/parser.py")
          text = path.read_text(encoding="utf-8")

          counter = '        self._yield_from_counter = 0\n'
          if counter not in text:
              anchor = '        self._deco_tmp_counter = 0\n'
              if anchor not in text:
                  raise SystemExit("parser counter anchor not found")
              text = text.replace(anchor, anchor + counter, 1)

          signature = 'item_name = "__yield_from_" + str(self._yield_from_counter)'
          if signature not in text:
              start_marker = '            if t.value == "yield":\n'
              end_marker = '\n\n        # `match` is a soft keyword'
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit("yield parser branch start not found")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit("yield parser branch end not found")
              branch = '''            if t.value == "yield":
                  pos = self._eat().pos
                  if self._check("KEYWORD", "from"):
                      self._eat()
                      iterable = self._parse_expr()
                      self._expect("NEWLINE")
                      self._yield_from_counter += 1
                      item_name = "__yield_from_" + str(self._yield_from_counter)
                      return A.For(
                          var=item_name,
                          range_args=[],
                          iter=iterable,
                          body=[
                              A.YieldStmt(
                                  value=A.Name(name=item_name, pos=pos),
                                  pos=pos,
                              )
                          ],
                          pos=pos,
                      )
                  if self._check("NEWLINE"):
                      val: A.Expr = A.IntLit(value=0, pos=pos)
                  else:
                      val = self._parse_expr()
                  self._expect("NEWLINE")
                  return A.YieldStmt(value=val, pos=pos)
'''
              text = text[:start] + branch + text[end:]

          path.write_text(text, encoding="utf-8")
          PY
      - name: Compile and run focused native regression
        run: |
          python -m asmpython tests/cases/467_yield_from.py --target linux -o /tmp/asmpython-yield-from
          output=$(/tmp/asmpython-yield-from)
          printf '%s\n' "$output"
          test "$output" = $'1\n2'
      - name: Confirm Somnia generator modules parse
        run: |
          git clone --depth 1 https://github.com/deltathedumb/somnia.git ../somnia
          python - <<'PY'
          from pathlib import Path
          from asmpython._compiler.lexer import Lexer
          from asmpython._compiler.parser import Parser

          for rel in ("somnia/model/core.py", "somnia/model/document.py"):
              path = Path("../somnia") / rel
              Parser(Lexer(path.read_text(encoding="utf-8")).tokenize()).parse()
              print("PASS", rel)
          PY
      - name: Commit verified compiler fix to PR branch
        run: |
          if git diff --quiet -- asmpython/_compiler/parser.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asmpython/_compiler/parser.py
          git commit -m "Lower yield-from delegation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
