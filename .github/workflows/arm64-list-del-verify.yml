name: Export float runtime sources

on:
  pull_request:
    paths:
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload runtime sources
        uses: actions/upload-artifact@v4
        with:
          name: float-runtime-sources
          path: |
            asmpython/_runtime/abi_shims.asm
            asmpython/_runtime/abi_shims_linux.asm
            asmpython/_runtime/runtime.asm
            asmpython/_compiler/ir_lower.py
