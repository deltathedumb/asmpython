name: Diagnose typed tuple unpack

on:
  pull_request:
    paths:
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm gcc binutils file
      - name: Build and execute tuple-unpack case
        run: |
          set +e
          python -m asmpython tests/cases/63_tuple_unpack.py \
            --backend x86-64 --no-pyinbin-fallback -o /tmp/tuple_unpack \
            > tuple-build.stdout 2> tuple-build.stderr
          echo "build_status=$?" | tee tuple-status.txt
          ls -l /tmp/tuple_unpack >> tuple-status.txt 2>&1 || true
          file /tmp/tuple_unpack >> tuple-status.txt 2>&1 || true
          /tmp/tuple_unpack > tuple-run.stdout 2> tuple-run.stderr
          echo "run_status=$?" >> tuple-status.txt
          printf '1\n2\nlabel: a\nn: 5\n1.5\n2.5\n0\n1\n2\nsum: 3\n' > tuple-expected.txt
          diff -u tuple-expected.txt tuple-run.stdout > tuple-diff.txt 2>&1
          echo "diff_status=$?" >> tuple-status.txt
          objdump -D -Mintel /tmp/tuple_unpack > tuple-disassembly.txt 2>&1 || true
          cat tuple-status.txt
          cat tuple-diff.txt
          exit 0
      - name: Upload tuple diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: typed-tuple-diagnostic
          path: |
            tuple-build.stdout
            tuple-build.stderr
            tuple-run.stdout
            tuple-run.stderr
            tuple-expected.txt
            tuple-diff.txt
            tuple-status.txt
            tuple-disassembly.txt
            tests/cases/63_tuple_unpack.py
