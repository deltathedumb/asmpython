name: Verify ARM64 list deletion

on:
  push:
    branches: [beta]
    paths:
      - "asmpython/_runtime/abi_list_del_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_del.py"
      - "tests/test_arm64_list_del.py"
      - ".github/workflows/arm64-list-del-verify.yml"
  pull_request:
    paths:
      - "asmpython/_runtime/abi_list_del_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_del.py"
      - "tests/test_arm64_list_del.py"
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AArch64 and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user nasm gcc file
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_del tests.test_driver_output_permissions
      - name: Capture repeated-print relocation pipeline
        run: |
          cat > /tmp/two_uvw.py <<'PY'
          a, b, c = "xyz"
          print(a, b, c)
          u, v, w = "abc"
          print(u, v, w)
          PY
          python -m asmpython build /tmp/two_uvw.py \
            --target linux -o /tmp/two_uvw --no-pyinbin-fallback
          /tmp/two_uvw > repeated-print.stdout 2> repeated-print.stderr || true
          objdump -d -Mintel /tmp/two_uvw > repeated-print.disassembly.txt
          python - <<'PY' > repeated-print-relocs.txt
          from pathlib import Path
          from asmpython._backends.x86_64 import run_backend_codegen
          from asmpython._backends.x86_64.elf_parse import parse_elf
          from asmpython._compiler import ir_lower
          from asmpython._compiler.driver import _compile_program

          path = Path("/tmp/two_uvw.py")
          module = _compile_program(
              path.read_text(encoding="utf-8"),
              source_dir=path.parent,
              entry_path=path,
              whole_program=False,
              all_errors=False,
              active_extensions=frozenset(),
          )
          lowered = ir_lower.lower_module(module)
          object_blob = next(iter(run_backend_codegen(
              lowered,
              {"target_os": "linux", "abi": "sysv"},
          ).values()))
          Path("/tmp/two_uvw.o").write_bytes(object_blob)
          parsed = parse_elf(object_blob)
          for section in parsed.sections:
              if not section.relocs:
                  continue
              print(f"SECTION {section.name}")
              for relocation in section.relocs:
                  print(relocation)
          PY
          cat repeated-print.stdout
          cat repeated-print-relocs.txt
      - name: Upload repeated-print relocation diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: repeated-print-relocations
          path: |
            repeated-print.stdout
            repeated-print.stderr
            repeated-print.disassembly.txt
            repeated-print-relocs.txt
            /tmp/two_uvw.o
            /tmp/two_uvw
      - name: Execute valid-index list deletion through QEMU
        run: python -m asmpython._backends.arm64._verify_list_del --mode cross

  native-verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_del
      - name: Execute valid-index list deletion natively
        run: python -m asmpython._backends.arm64._verify_list_del --mode native
