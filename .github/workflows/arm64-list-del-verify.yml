name: Inspect typed tuple unpack failure

on:
  pull_request:
    paths:
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate typed-unpack workflow and cases
        run: |
          grep -R -n "Compile and execute typed tuple unpack case" .github/workflows \
            | tee typed-unpack-location.txt || true
          grep -R -n "tuple.*unpack\|unpack.*tuple" tests .github/workflows \
            | tee typed-unpack-references.txt || true
      - name: Upload workflow and case sources
        uses: actions/upload-artifact@v4
        with:
          name: typed-unpack-sources
          path: |
            typed-unpack-location.txt
            typed-unpack-references.txt
            .github/workflows
            tests/cases
