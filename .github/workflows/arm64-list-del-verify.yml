name: Diagnose feature-branch push

on:
  pull_request:
    paths:
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/python314-arm64-list-del
          fetch-depth: 0
      - name: Capture authenticated dry-run push
        run: |
          set +e
          git config user.name "asmpython-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "diagnose feature branch push"
          {
            echo '=== remotes ==='
            git remote -v
            echo '=== status ==='
            git status --short --branch
            echo '=== dry-run normal push ==='
            git push --dry-run origin HEAD:agent/python314-arm64-list-del
            echo "normal_status=$?"
            echo '=== dry-run force-with-lease push ==='
            git push --dry-run --force-with-lease origin HEAD:agent/python314-arm64-list-del
            echo "lease_status=$?"
          } 2>&1 | tee feature-branch-push.log
          exit 0
      - name: Upload push diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-push-log
          path: feature-branch-push.log
