name: Verify ARM64 list deletion

on:
  push:
    branches: [beta]
    paths:
      - "asmpython/_runtime/abi_list_del_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_del.py"
      - "tests/test_arm64_list_del.py"
      - ".github/workflows/arm64-list-del-verify.yml"
  pull_request:
    paths:
      - "asmpython/_runtime/abi_list_del_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_del.py"
      - "tests/test_arm64_list_del.py"
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AArch64 binutils and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_del
      - name: Collect legacy focused-test diagnostics
        id: legacy-focused
        continue-on-error: true
        run: |
          python -m unittest -v \
            tests.test_arm64_list_core \
            tests.test_arm64_list_extend \
            tests.test_arm64_list_insert \
            tests.test_arm64_list_pop \
            tests.test_arm64_list_repeat \
            tests.test_arm64_list_reverse \
            tests.test_arm64_float_ulp \
            2>&1 | tee legacy-focused-tests.log
      - name: Preserve legacy focused-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-legacy-focused-test-log
          path: legacy-focused-tests.log
      - name: Execute valid-index list deletion through QEMU
        run: python -m asmpython._backends.arm64._verify_list_del --mode cross

  native-verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_del
      - name: Execute valid-index list deletion natively
        run: python -m asmpython._backends.arm64._verify_list_del --mode native
