name: Apply x86 SysV vararg fix

on:
  pull_request:
    paths:
      - "asmpython/_backends/x86_64/codegen.py"
      - "tests/test_x86_64_sysv_varargs.py"
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/python314-arm64-list-del
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Move SysV AL write after argument capture
        run: |
          python - <<'PY'
          from pathlib import Path

          codegen = Path("asmpython/_backends/x86_64/codegen.py")
          text = codegen.read_text(encoding="utf-8")
          early = '''        if is_sysv_vararg:\n            # SysV AMD64 passes the number of live vector arguments in AL for\n            # variadic calls such as printf/sprintf.\n            self._emit(encode_mov_ri(Reg.RAX, xmm_i))\n\n'''
          if early not in text:
              raise SystemExit("early SysV vararg AL write was not found")
          text = text.replace(early, "", 1)

          call_boundary = '''        for dst_r, temp_i, typ in gp_dup_slots:\n            if typ == "f32":\n                self._emit(encode_mov_rm32(dst_r, Mem(Reg.RSP, temp_base + 8 * temp_i)))\n            else:\n                self._emit(encode_mov_rm(dst_r, Mem(Reg.RSP, temp_base + 8 * temp_i)))\n\n        if is_indirect:\n'''
          replacement = '''        for dst_r, temp_i, typ in gp_dup_slots:\n            if typ == "f32":\n                self._emit(encode_mov_rm32(dst_r, Mem(Reg.RSP, temp_base + 8 * temp_i)))\n            else:\n                self._emit(encode_mov_rm(dst_r, Mem(Reg.RSP, temp_base + 8 * temp_i)))\n\n        if is_sysv_vararg:\n            # SysV AMD64 passes the number of live vector arguments in AL for\n            # variadic calls such as printf/sprintf. Do this only after every\n            # argument has been captured and loaded: register allocation may\n            # place an argument (including the format pointer) in RAX, and an\n            # earlier write to EAX would silently replace that value with null.\n            self._emit(encode_mov_ri(Reg.RAX, xmm_i))\n\n        if is_indirect:\n'''
          if call_boundary not in text:
              raise SystemExit("SysV call boundary changed")
          text = text.replace(call_boundary, replacement, 1)
          codegen.write_text(text, encoding="utf-8")

          Path("tests/test_x86_64_sysv_varargs.py").write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom asmpython._backends.x86_64.codegen import FuncCodegen\nfrom asmpython._backends.x86_64.encoder import (\n    Mem,\n    Reg,\n    encode_call_rel32,\n    encode_mov_mr,\n    encode_mov_ri,\n)\nfrom asmpython._backends.x86_64.regalloc import AllocResult, RegLoc\nfrom asmpython._compiler.ir import I64, PTR, IRBlock, IRFunc, IRInstr, IRValue\n\n\nclass SysvVarargCallTests(unittest.TestCase):\n    def test_rax_argument_is_captured_before_al_vector_count_write(self) -> None:\n        fmt = IRValue("fmt", PTR)\n        first = IRValue("first", PTR)\n        second = IRValue("second", PTR)\n        third = IRValue("third", PTR)\n        func = IRFunc("probe", [], I64, [IRBlock("entry")])\n        alloc = AllocResult(\n            locs={\n                fmt.name: RegLoc(Reg.RAX),\n                first.name: RegLoc(Reg.RBX),\n                second.name: RegLoc(Reg.R12),\n                third.name: RegLoc(Reg.R13),\n            },\n            alloca_slots={},\n            stack_bytes=0,\n            callee_saved=[],\n            callee_saved_xmm=[],\n        )\n        generator = FuncCodegen(func, alloc, "sysv")\n\n        generator._call(\n            IRInstr("call", None, ["printf", fmt, first, second, third])\n        )\n        code = bytes(generator.buf)\n\n        capture_rax = encode_mov_mr(Mem(Reg.RSP, 0), Reg.RAX)\n        set_vector_count = encode_mov_ri(Reg.RAX, 0)\n        call_printf = encode_call_rel32(0)\n        capture_at = code.index(capture_rax)\n        vector_count_at = code.index(set_vector_count)\n        call_at = code.index(call_printf)\n\n        self.assertLess(capture_at, vector_count_at)\n        self.assertLess(vector_count_at, call_at)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")

          Path(".github/workflows/arm64-list-del-verify.yml").write_text('''name: Verify ARM64 list deletion\n\non:\n  push:\n    branches: [beta]\n    paths:\n      - "asmpython/_runtime/abi_list_del_linux_arm64.S"\n      - "asmpython/_backends/arm64/runtime_manifest.py"\n      - "asmpython/_backends/arm64/_verify_list_del.py"\n      - "tests/test_arm64_list_del.py"\n      - ".github/workflows/arm64-list-del-verify.yml"\n  pull_request:\n    paths:\n      - "asmpython/_runtime/abi_list_del_linux_arm64.S"\n      - "asmpython/_backends/arm64/runtime_manifest.py"\n      - "asmpython/_backends/arm64/_verify_list_del.py"\n      - "tests/test_arm64_list_del.py"\n      - ".github/workflows/arm64-list-del-verify.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  cross-verify:\n    runs-on: ubuntu-24.04\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Install AArch64 binutils and QEMU\n        run: |\n          sudo apt-get update\n          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user\n      - name: Run exact lowering and manifest tests\n        run: python -m unittest -v tests.test_arm64_list_del\n      - name: Execute valid-index list deletion through QEMU\n        run: python -m asmpython._backends.arm64._verify_list_del --mode cross\n\n  native-verify:\n    runs-on: ubuntu-24.04-arm\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Install native binutils\n        run: |\n          sudo apt-get update\n          sudo apt-get install --yes binutils\n      - name: Run exact lowering and manifest tests\n        run: python -m unittest -v tests.test_arm64_list_del\n      - name: Execute valid-index list deletion natively\n        run: python -m asmpython._backends.arm64._verify_list_del --mode native\n''', encoding="utf-8")
          PY
          python -m py_compile \
            asmpython/_backends/x86_64/codegen.py \
            tests/test_x86_64_sysv_varargs.py
          python -m unittest -v tests.test_x86_64_sysv_varargs
      - name: Commit fix and remove diagnostic workflow
        run: |
          git config user.name "asmpython-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Preserve RAX arguments for SysV variadic calls"
          git push origin HEAD:agent/python314-arm64-list-del
