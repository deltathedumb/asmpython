name: Verify ARM64 list deletion

on:
  push:
    branches: [beta]
    paths:
      - "asmpython/_runtime/abi_list_del_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_del.py"
      - "tests/test_arm64_list_del.py"
      - ".github/workflows/arm64-list-del-verify.yml"
  pull_request:
    paths:
      - "asmpython/_runtime/abi_list_del_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_del.py"
      - "tests/test_arm64_list_del.py"
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-driver-fix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/python314-arm64-list-del
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch executable output handling
        run: |
          python - <<'PY'
          from pathlib import Path

          driver = Path("asmpython/_compiler/driver.py")
          text = driver.read_text(encoding="utf-8")
          insertion = '''    return module\n\n\ndef _run_backend_x86_64(\n'''
          helper = '''    return module\n\n\ndef _write_backend_output(\n    out_path: Path,\n    out_bytes: bytes,\n    *,\n    executable: bool,\n) -> Path:\n    \"\"\"Write backend output and preserve the executable contract on POSIX.\n\n    ``Path.write_bytes`` creates a regular data file (typically mode 0o644).\n    Built-in linkers return bytes rather than writing the final path themselves,\n    so Linux executables must have their execute bits restored explicitly.\n    \"\"\"\n    resolved = out_path.resolve()\n    resolved.parent.mkdir(parents=True, exist_ok=True)\n    resolved.write_bytes(out_bytes)\n    if executable and os.name != \"nt\":\n        resolved.chmod(resolved.stat().st_mode | 0o111)\n    return resolved\n\n\ndef _run_backend_x86_64(\n'''
          if "def _write_backend_output(" not in text:
              if insertion not in text:
                  raise SystemExit("driver helper insertion point changed")
              text = text.replace(insertion, helper, 1)

          old_write = '''    out_path = out_path.resolve()\n    out_path.parent.mkdir(parents=True, exist_ok=True)\n    out_path.write_bytes(out_bytes)\n\n    print(f\"wrote {out_path}\")\n'''
          new_write = '''    out_path = _write_backend_output(\n        out_path,\n        out_bytes,\n        executable=target == \"linux\",\n    )\n\n    print(f\"wrote {out_path}\")\n'''
          if old_write in text:
              text = text.replace(old_write, new_write, 1)
          elif new_write not in text:
              raise SystemExit("x86-64 output write point changed")
          driver.write_text(text, encoding="utf-8")

          Path("tests/test_driver_output_permissions.py").write_text('''from __future__ import annotations\n\nimport os\nimport stat\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nfrom asmpython._compiler.driver import _write_backend_output\n\n\n@unittest.skipIf(os.name == "nt", "POSIX execute bits are not meaningful on Windows")\nclass DriverOutputPermissionTests(unittest.TestCase):\n    def test_executable_output_adds_all_execute_bits(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n            output = Path(tmp) / "program"\n            output.write_bytes(b"old")\n            output.chmod(0o600)\n\n            result = _write_backend_output(output, b"ELF", executable=True)\n\n            self.assertEqual(result, output.resolve())\n            self.assertEqual(output.read_bytes(), b"ELF")\n            self.assertEqual(stat.S_IMODE(output.stat().st_mode), 0o711)\n\n    def test_data_output_preserves_non_executable_mode(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n            output = Path(tmp) / "data.bin"\n            output.write_bytes(b"old")\n            output.chmod(0o600)\n\n            _write_backend_output(output, b"data", executable=False)\n\n            self.assertEqual(output.read_bytes(), b"data")\n            self.assertEqual(stat.S_IMODE(output.stat().st_mode), 0o600)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")

          Path("asmpython/_compiler/__init__.py").write_text('''\"\"\"asmpython compiler front-end: lex -> parse -> sema -> NASM codegen.\n\nThis is the private implementation package. The user-facing API lives in\n`asmpython` (the parent package) and `asmpython.assembly`.\n\"\"\"\n\nfrom .. import __version__  # re-export the single source of truth\nfrom . import linux_runtime_fixes as _linux_runtime_fixes\n\n__all__ = [\"__version__\"]\n''', encoding="utf-8")

          for temporary in (
              Path("tests/test_unpack_normalize_install.py"),
              Path(".github/workflows/diagnose-typed-unpack.yml"),
          ):
              if temporary.exists():
                  temporary.unlink()
          PY
          python -m py_compile asmpython/_compiler/driver.py tests/test_driver_output_permissions.py
          python -m unittest -v tests.test_driver_output_permissions
      - name: Commit driver fix
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Driver fix already applied"
            exit 0
          fi
          git config user.name "asmpython-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Mark built-in Linux backend outputs executable"
          git push origin HEAD:agent/python314-arm64-list-del

  cross-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AArch64 and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user nasm gcc file
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_del
      - name: Capture typed-unpack compiler diagnostics
        run: |
          set +e
          {
            echo '=== compile string unpack ==='
            python -m asmpython build tests/cases/440_str_unpack.py \
              --target linux -o /tmp/str-unpack --no-pyinbin-fallback
            build_status=$?
            echo "build_status=$build_status"
            if [ "$build_status" -eq 0 ]; then
              echo '=== execute string unpack ==='
              /tmp/str-unpack
              echo "execute_status=$?"
              echo '=== file metadata ==='
              file /tmp/str-unpack
            fi
          } 2>&1 | tee typed-unpack-diagnostic.log
          exit 0
      - name: Upload typed-unpack diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: typed-unpack-diagnostic
          path: typed-unpack-diagnostic.log
      - name: Execute valid-index list deletion through QEMU
        run: python -m asmpython._backends.arm64._verify_list_del --mode cross

  native-verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_del
      - name: Execute valid-index list deletion natively
        run: python -m asmpython._backends.arm64._verify_list_del --mode native
