name: Verify ARM64 list deletion

on:
  push:
    branches: [beta]
    paths:
      - "asmpython/_runtime/abi_list_del_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_del.py"
      - "tests/test_arm64_list_del.py"
      - ".github/workflows/arm64-list-del-verify.yml"
  pull_request:
    paths:
      - "asmpython/_runtime/abi_list_del_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_del.py"
      - "tests/test_arm64_list_del.py"
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AArch64 and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user nasm gcc file
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_del tests.test_driver_output_permissions
      - name: Capture string-unpack matrix and IR
        run: |
          cat > /tmp/two_uvw.py <<'PY'
          a, b, c = "xyz"
          print(a, b, c)
          u, v, w = "abc"
          print(u, v, w)
          PY
          cat > /tmp/original.py <<'PY'
          a, b, c = "xyz"
          print(a, b, c)
          p, q, r = "abc"
          print(p, q, r)
          h, e, l1, l2, o = "hello"
          print(h, e, l1, l2, o)
          PY
          set +e
          : > string-unpack-matrix.log
          for name in two_uvw original; do
            {
              echo "=== $name ==="
              python -m asmpython build "/tmp/$name.py" \
                --target linux -o "/tmp/$name" --no-pyinbin-fallback
              build_status=$?
              echo "build_status=$build_status"
              if [ "$build_status" -eq 0 ]; then
                "/tmp/$name" > "/tmp/$name.stdout" 2> "/tmp/$name.stderr"
                echo "run_status=$?"
                cat "/tmp/$name.stdout"
              fi
            } >> string-unpack-matrix.log 2>&1
          done
          python - <<'PY' > string-unpack-ir.txt
          from pathlib import Path
          from asmpython._backends.x86_64 import __module_backend__
          from asmpython._compiler import ir_lower
          from asmpython._compiler.driver import _compile_program

          for filename in ("/tmp/two_uvw.py", "/tmp/original.py"):
              path = Path(filename)
              module = _compile_program(
                  path.read_text(encoding="utf-8"),
                  source_dir=path.parent,
                  entry_path=path,
                  whole_program=False,
                  all_errors=False,
                  active_extensions=frozenset(),
              )
              lowered = ir_lower.lower_module(module)
              print(f"=== {path.name} ===")
              for function in lowered.funcs:
                  print(f"FUNCTION {function.name}")
                  for block in function.blocks:
                      print(f"BLOCK {block.label}")
                      for instruction in block.instrs:
                          print(repr(instruction))
                      print("TERM", repr(block.terminator))
          PY
          cat string-unpack-matrix.log
          cat string-unpack-ir.txt
          exit 0
      - name: Upload string-unpack lowering diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: string-unpack-lowering
          path: |
            string-unpack-matrix.log
            string-unpack-ir.txt
            asmpython/_compiler/ir_lower.py
      - name: Execute valid-index list deletion through QEMU
        run: python -m asmpython._backends.arm64._verify_list_del --mode cross

  native-verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_del
      - name: Execute valid-index list deletion natively
        run: python -m asmpython._backends.arm64._verify_list_del --mode native
