name: Inspect tuple iteration lowering

on:
  pull_request:
    paths:
      - ".github/workflows/arm64-list-del-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload tuple iteration compiler sources
        uses: actions/upload-artifact@v4
        with:
          name: tuple-iteration-sources
          path: |
            asmpython/_compiler/sema.py
            asmpython/_compiler/ir_lower.py
            asmpython/_compiler/ast_nodes.py
            asmpython/_compiler/unpack_normalize.py
            asmpython/_backends/x86_64/unpack_normalize.py
            tests/cases/63_tuple_unpack.py
            tests/test_x86_unpack_normalize.py
