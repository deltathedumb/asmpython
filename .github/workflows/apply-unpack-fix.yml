name: Apply verified unpack lowering fix

on:
  push:
    branches: [beta]
    paths:
      - ".github/workflows/apply-unpack-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm gcc
      - name: Apply surgical lowering fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("asmpython/_compiler/ir_lower.py")
          text = path.read_text(encoding="utf-8")
          old = '''        names = [t.name for t in s.targets]
        if len(s.values) == 1 and A.expr_type(s.values[0]) in ("list", "tuple"):
            # Single-iterable unpack (a, b = some_tuple_or_list_expr).
            src_v = _lower_expr(ctx, s.values[0])
            for i, name in enumerate(names):
                idx_v = ctx.tmp(I64)
                ctx.emit(IRInstr("const", idx_v, [i]))
                addr = _list_elem_addr(ctx, src_v, idx_v)
                elem_ty = I64
                val = ctx.tmp(elem_ty)
                ctx.emit(IRInstr("load", val, [addr]))
                ptr = _name_ptr(ctx, name, ctx.mctx.global_types.get(name, elem_ty))
                ctx.emit(IRInstr("store", None, [val, ptr]))
            return
'''
          new = '''        names = [t.name for t in s.targets]
        if len(s.values) == 1 and isinstance(s.values[0], A.TupleLit):
            # A literal tuple already exposes every element as a real AST node.
            # Evaluate all elements before performing any target store (the same
            # parallel-assignment rule as ``a, b = b, a``), then retain each
            # element's actual IR type. The old generic buffer path hardcoded
            # every slot to I64, so str pointers and F64 values were silently
            # stored/read through the wrong register class.
            vals = [_lower_expr(ctx, elem) for elem in s.values[0].elems]
            for name, val in zip(names, vals):
                ptr = _name_ptr(ctx, name, ctx.mctx.global_types.get(name, val.type))
                ctx.emit(IRInstr("store", None, [val, ptr]))
            return
        if len(s.values) == 1 and A.expr_type(s.values[0]) == "str":
            # String iteration/unpacking yields fresh one-character strings, not
            # integer byte values. Evaluate the source once and use the same
            # character helper as ordinary string indexing. _name_ptr is
            # essential here: at module scope these targets are globals, while
            # ensure_slot would write unrelated local storage.
            src_v = _lower_expr(ctx, s.values[0])
            for i, name in enumerate(names):
                idx_v = ctx.tmp(I64)
                ctx.emit(IRInstr("const", idx_v, [i]))
                val = ctx.tmp(PTR)
                ctx.emit(IRInstr("call", val, ["_abi_str_char_at", src_v, idx_v]))
                ptr = _name_ptr(ctx, name, ctx.mctx.global_types.get(name, PTR))
                ctx.emit(IRInstr("store", None, [val, ptr]))
            return
        if len(s.values) == 1 and A.expr_type(s.values[0]) in ("list", "tuple"):
            # Single-iterable unpack (a, b = some_tuple_or_list_expr).
            src_v = _lower_expr(ctx, s.values[0])
            for i, name in enumerate(names):
                idx_v = ctx.tmp(I64)
                ctx.emit(IRInstr("const", idx_v, [i]))
                addr = _list_elem_addr(ctx, src_v, idx_v)
                elem_ty = I64
                val = ctx.tmp(elem_ty)
                ctx.emit(IRInstr("load", val, [addr]))
                ptr = _name_ptr(ctx, name, ctx.mctx.global_types.get(name, elem_ty))
                ctx.emit(IRInstr("store", None, [val, ptr]))
            return
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one unpack lowering block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile asmpython/_compiler/ir_lower.py
      - name: Compile and execute focused x86-64 cases
        run: |
          python -m asmpython tests/cases/440_str_unpack.py --backend x86-64 --no-pyinbin-fallback -o /tmp/str_unpack
          /tmp/str_unpack > /tmp/str_unpack.out
          printf 'x y z\na b c\nh e l l o\n' > /tmp/str_unpack.expected
          diff -u /tmp/str_unpack.expected /tmp/str_unpack.out

          python -m asmpython tests/cases/63_tuple_unpack.py --backend x86-64 --no-pyinbin-fallback -o /tmp/tuple_unpack
          /tmp/tuple_unpack > /tmp/tuple_unpack.out
          printf '1\n2\nlabel: a\nn: 5\n1.5\n2.5\n0\n1\n2\nsum: 3\n' > /tmp/tuple_unpack.expected
          diff -u /tmp/tuple_unpack.expected /tmp/tuple_unpack.out
      - name: Commit verified patch and remove one-shot workflow
        run: |
          rm .github/workflows/apply-unpack-fix.yml
          git config user.name "asmpython automation"
          git config user.email "actions@users.noreply.github.com"
          git add asmpython/_compiler/ir_lower.py .github/workflows/apply-unpack-fix.yml
          git commit -m "Fix string and typed tuple unpack lowering"
          git push origin HEAD:beta
