      - name: Verify exact modf fractional part natively
        run: python -m asmpython._backends.arm64._verify_float_modf_frac --mode native
      - name: Verify exact modf integral part natively
        run: python -m asmpython._backends.arm64._verify_float_modf_int --mode native
      - name: Verify exact frexp mantissa natively
        run: python -m asmpython._backends.arm64._verify_float_frexp_m --mode native
      - name: Verify exact frexp exponent natively
        run: python -m asmpython._backends.arm64._verify_float_frexp_e --mode native
      - name: Verify exact fdim natively
        run: python -m asmpython._backends.arm64._verify_float_fdim --mode native
      - name: Verify exact nextafter natively
        run: python -m asmpython._backends.arm64._verify_float_nextafter --mode native
      - name: Verify exact ceil natively
