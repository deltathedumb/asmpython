      - name: Verify prefix and suffix removal natively
        run: python -m asmpython._backends.arm64._verify_string_remove --mode native
      - name: Verify Unicode find and rfind natively
        run: python -m asmpython._backends.arm64._verify_string_find --mode native
      - name: Verify Unicode replacement natively
        run: python -m asmpython._backends.arm64._verify_string_replace --mode native
      - name: Verify Unicode string slicing natively
        run: python -m asmpython._backends.arm64._verify_string_slice --mode native
      - name: Verify Unicode zfill natively
        run: python -m asmpython._backends.arm64._verify_string_zfill --mode native
      - name: Verify exact float absolute value natively
        run: python -m asmpython._backends.arm64._verify_float_abs --mode native
      - name: Verify exact float copysign natively
        run: python -m asmpython._backends.arm64._verify_float_copysign --mode native
      - name: Verify exact isnan natively
        run: python -m asmpython._backends.arm64._verify_float_isnan --mode native
      - name: Verify exact isinf natively
