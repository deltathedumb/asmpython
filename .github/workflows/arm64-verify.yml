name: Verify ARM64 backend

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - "asmpython/_backends/arm64/**"
      - "asmpython/_runtime/abi_shims_linux_arm64.S"
      - "asmpython/_compiler/ir.py"
      - "tests/test_arm64_codegen.py"
      - "tests/test_arm64_elf.py"
      - "tests/test_arm64_linux_link.py"
      - "tests/test_arm64_module_codegen.py"
      - "tests/test_arm64_source_codegen.py"
      - ".github/workflows/arm64-verify.yml"
  pull_request:
    paths:
      - "asmpython/_backends/arm64/**"
      - "asmpython/_runtime/abi_shims_linux_arm64.S"
      - "asmpython/_compiler/ir.py"
      - "tests/test_arm64_codegen.py"
      - "tests/test_arm64_elf.py"
      - "tests/test_arm64_linux_link.py"
      - "tests/test_arm64_module_codegen.py"
      - "tests/test_arm64_source_codegen.py"
      - ".github/workflows/arm64-verify.yml"

permissions:
  contents: read

jobs:
  cross-verify:
    name: Cross toolchain + QEMU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AArch64 binutils and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user

      - name: Check Python modules
        run: |
          python -m py_compile \
            asmpython/_backends/arm64/encoder.py \
            asmpython/_backends/arm64/regalloc.py \
            asmpython/_backends/arm64/codegen.py \
            asmpython/_backends/arm64/elf.py \
            asmpython/_backends/arm64/elf_inspect.py \
            asmpython/_backends/arm64/linux_link.py \
            asmpython/_backends/arm64/module_codegen.py \
            asmpython/_backends/arm64/_verify_encoder.py \
            asmpython/_backends/arm64/_verify_elf.py \
            asmpython/_backends/arm64/_verify_source.py \
            asmpython/_backends/arm64/_verify_print.py \
            tests/test_arm64_codegen.py \
            tests/test_arm64_elf.py \
            tests/test_arm64_linux_link.py \
            tests/test_arm64_module_codegen.py \
            tests/test_arm64_source_codegen.py

      - name: Verify instruction encoder against GNU assembler
        run: python -m asmpython._backends.arm64._verify_encoder

      - name: Run ARM64 structure and codegen tests
        run: |
          python -m unittest \
            tests.test_arm64_codegen \
            tests.test_arm64_elf \
            tests.test_arm64_linux_link \
            tests.test_arm64_module_codegen \
            tests.test_arm64_source_codegen \
            -v

      - name: Link and execute generated IR through QEMU
        run: python -m asmpython._backends.arm64._verify_elf --mode cross

      - name: Compile source and execute through QEMU
        run: python -m asmpython._backends.arm64._verify_source --mode cross

      - name: Verify freestanding print runtime through QEMU
        run: python -m asmpython._backends.arm64._verify_print --mode cross

  native-verify:
    name: Native ARM64 execution
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native binutils and strace
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils strace

      - name: Check and run focused tests
        run: |
          python -m py_compile \
            asmpython/_backends/arm64/encoder.py \
            asmpython/_backends/arm64/regalloc.py \
            asmpython/_backends/arm64/codegen.py \
            asmpython/_backends/arm64/elf.py \
            asmpython/_backends/arm64/elf_inspect.py \
            asmpython/_backends/arm64/linux_link.py \
            asmpython/_backends/arm64/module_codegen.py \
            asmpython/_backends/arm64/_verify_elf.py \
            asmpython/_backends/arm64/_verify_source.py \
            asmpython/_backends/arm64/_verify_print.py \
            tests/test_arm64_codegen.py \
            tests/test_arm64_elf.py \
            tests/test_arm64_linux_link.py \
            tests/test_arm64_module_codegen.py \
            tests/test_arm64_source_codegen.py
          python -m unittest \
            tests.test_arm64_codegen \
            tests.test_arm64_elf \
            tests.test_arm64_linux_link \
            tests.test_arm64_module_codegen \
            tests.test_arm64_source_codegen \
            -v

      - name: Link and execute generated IR natively
        run: python -m asmpython._backends.arm64._verify_elf --mode native

      - name: Compile source and execute natively
        run: python -m asmpython._backends.arm64._verify_source --mode native

      - name: Verify freestanding print runtime natively
        run: python -m asmpython._backends.arm64._verify_print --mode native
