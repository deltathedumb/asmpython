name: Verify ARM64 backend

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - "asmpython/_backends/arm64/**"
      - "asmpython/_runtime/*linux_arm64.S"
      - "asmpython/_compiler/ir.py"
      - "tests/test_arm64_*.py"
      - ".github/workflows/arm64-verify.yml"
  pull_request:
    paths:
      - "asmpython/_backends/arm64/**"
      - "asmpython/_runtime/*linux_arm64.S"
      - "asmpython/_compiler/ir.py"
      - "tests/test_arm64_*.py"
      - ".github/workflows/arm64-verify.yml"

permissions:
  contents: read

jobs:
  cross-verify:
    name: Cross toolchain + QEMU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AArch64 binutils and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user
      - name: Compile and run focused ARM64 tests
        run: |
          python -m compileall -q asmpython/_backends/arm64
          python -m unittest discover -s tests -p 'test_arm64_*.py' -v
      - name: Verify instruction encoder against GNU assembler
        run: python -m asmpython._backends.arm64._verify_encoder
      - name: Link and execute generated IR through QEMU
        run: python -m asmpython._backends.arm64._verify_elf --mode cross
      - name: Compile source and execute through QEMU
        run: python -m asmpython._backends.arm64._verify_source --mode cross
      - name: Verify freestanding print runtime through QEMU
        run: python -m asmpython._backends.arm64._verify_print --mode cross
      - name: Verify scalar and string runtime through QEMU
        run: python -m asmpython._backends.arm64._verify_scalars --mode cross
      - name: Verify string search runtime through QEMU
        run: python -m asmpython._backends.arm64._verify_string_search --mode cross
      - name: Verify string repetition runtime through QEMU
        run: python -m asmpython._backends.arm64._verify_string_repeat --mode cross
      - name: Verify deterministic string hashing through QEMU
        run: python -m asmpython._backends.arm64._verify_hash --mode cross
      - name: Verify prefix and suffix removal through QEMU
        run: python -m asmpython._backends.arm64._verify_string_remove --mode cross
      - name: Verify Unicode find and rfind through QEMU
        run: python -m asmpython._backends.arm64._verify_string_find --mode cross
      - name: Verify Unicode replacement through QEMU
        run: python -m asmpython._backends.arm64._verify_string_replace --mode cross
      - name: Verify Unicode string slicing through QEMU
        run: python -m asmpython._backends.arm64._verify_string_slice --mode cross
      - name: Verify Unicode zfill through QEMU
        run: python -m asmpython._backends.arm64._verify_string_zfill --mode cross
      - name: Verify exact float absolute value through QEMU
        run: python -m asmpython._backends.arm64._verify_float_abs --mode cross
      - name: Verify exact float copysign through QEMU
        run: python -m asmpython._backends.arm64._verify_float_copysign --mode cross
      - name: Verify exact isnan through QEMU
        run: python -m asmpython._backends.arm64._verify_float_isnan --mode cross
      - name: Verify exact isinf through QEMU
        run: python -m asmpython._backends.arm64._verify_float_isinf --mode cross
      - name: Verify exact isfinite through QEMU
        run: python -m asmpython._backends.arm64._verify_float_isfinite --mode cross
      - name: Verify exact degrees through QEMU
        run: python -m asmpython._backends.arm64._verify_float_degrees --mode cross
      - name: Verify exact radians through QEMU
        run: python -m asmpython._backends.arm64._verify_float_radians --mode cross
      - name: Verify exact nearbyint through QEMU
        run: python -m asmpython._backends.arm64._verify_float_nearbyint --mode cross
      - name: Verify exact gcd through QEMU
        run: python -m asmpython._backends.arm64._verify_int_gcd --mode cross
      - name: Verify exact lcm through QEMU
        run: python -m asmpython._backends.arm64._verify_int_lcm --mode cross
      - name: Verify exact modf fractional part through QEMU
        run: python -m asmpython._backends.arm64._verify_float_modf_frac --mode cross
      - name: Verify exact modf integral part through QEMU
        run: python -m asmpython._backends.arm64._verify_float_modf_int --mode cross
      - name: Verify exact frexp mantissa through QEMU
        run: python -m asmpython._backends.arm64._verify_float_frexp_m --mode cross
      - name: Verify exact frexp exponent through QEMU
        run: python -m asmpython._backends.arm64._verify_float_frexp_e --mode cross
      - name: Verify exact fdim through QEMU
        run: python -m asmpython._backends.arm64._verify_float_fdim --mode cross
      - name: Verify exact nextafter through QEMU
        run: python -m asmpython._backends.arm64._verify_float_nextafter --mode cross
      - name: Verify exact ceil through QEMU
        run: python -m asmpython._backends.arm64._verify_float_ceil --mode cross
      - name: Verify exact floor through QEMU
        run: python -m asmpython._backends.arm64._verify_float_floor --mode cross
      - name: Verify exact trunc through QEMU
        run: python -m asmpython._backends.arm64._verify_float_trunc --mode cross

  native-verify:
    name: Native ARM64 execution
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native binutils and strace
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils strace
      - name: Compile and run focused ARM64 tests
        run: |
          python -m compileall -q asmpython/_backends/arm64
          python -m unittest discover -s tests -p 'test_arm64_*.py' -v
      - name: Link and execute generated IR natively
        run: python -m asmpython._backends.arm64._verify_elf --mode native
      - name: Compile source and execute natively
        run: python -m asmpython._backends.arm64._verify_source --mode native
      - name: Verify freestanding print runtime natively
