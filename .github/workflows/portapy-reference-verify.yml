name: Verify PortaPy reference API

on:
  push:
    branches: [beta]
    paths:
      - "portapy/**"
      - "tests/test_portapy_reference_api.py"
      - "docs/PORTAPY-DESIGN.md"
      - "docs/PYINBIN-DESIGN.md"
      - "roadmap.md"
      - ".github/workflows/portapy-reference-verify.yml"
  pull_request:
    paths:
      - "portapy/**"
      - "tests/test_portapy_reference_api.py"
      - "docs/PORTAPY-DESIGN.md"
      - "docs/PYINBIN-DESIGN.md"
      - "roadmap.md"
      - ".github/workflows/portapy-reference-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python API
        run: python -m py_compile portapy/reference_api.py tests/test_portapy_reference_api.py
      - name: Run reference API tests
        run: python -m unittest -v tests.test_portapy_reference_api
      - name: Syntax-check public C ABI and embedding example
        run: cc -std=c11 -Wall -Wextra -Werror -Iportapy/include -fsyntax-only portapy/examples/embed.c
