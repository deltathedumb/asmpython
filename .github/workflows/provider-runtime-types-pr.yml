name: Verify provider class values

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [beta/3.14.0]

permissions:
  contents: read

jobs:
  provider-class-values:
    if: github.event.pull_request.head.ref == 'fix/somnia-provider-runtime-types-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Test provider class values
        run: |
          python -m asmpython tests/cases/468_provider_type_runtime.py --target linux -o /tmp/asmpython-provider-types
          output=$(/tmp/asmpython-provider-types)
          printf '%s\n' "$output"
          test "$output" = $'True\nFalse\nTrue\nTrue\nTrue\nTrue'
      - name: Test property and generator string flow
        run: |
          python -m asmpython tests/cases/469_property_generator_string.py --target linux -o /tmp/asmpython-property-flow
          output=$(/tmp/asmpython-property-flow)
          printf '%s\n' "$output"
          test "$output" = $'2\nsomnia.Root'
      - name: Test unchanged Somnia parity
        id: somnia
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/deltathedumb/somnia.git ../somnia
          (
            cd ../somnia
            PYTHONPATH="$GITHUB_WORKSPACE" python tools/dualrun.py tests/parity/model_snapshot.py
          ) > somnia-parity.txt 2>&1
          cat somnia-parity.txt
      - name: Upload Somnia parity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somnia-provider-parity
          path: somnia-parity.txt
          retention-days: 7
      - name: Require Somnia parity
        if: steps.somnia.outcome != 'success'
        run: exit 1
