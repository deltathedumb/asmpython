name: Verify provider class values

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [beta/3.14.0]

permissions:
  contents: read

jobs:
  provider-class-values:
    if: github.event.pull_request.head.ref == 'fix/somnia-provider-runtime-types-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Test provider class values
        run: |
          python -m asmpython tests/cases/468_provider_type_runtime.py --target linux -o /tmp/asmpython-provider-types
          output=$(/tmp/asmpython-provider-types)
          printf '%s\n' "$output"
          test "$output" = $'True\nFalse\nTrue\nTrue\nTrue\nTrue'
      - name: Test property and generator string flow
        id: property_flow
        continue-on-error: true
        run: |
          set +e
          {
            python -m asmpython tests/cases/469_property_generator_string.py --target linux -o /tmp/asmpython-property-flow
            compile_status=$?
            echo "compile_status=$compile_status"
            if [ "$compile_status" -eq 0 ] && [ -x /tmp/asmpython-property-flow ]; then
              output=$(/tmp/asmpython-property-flow)
              native_status=$?
              printf '%s\n' "$output"
              echo "native_status=$native_status"
              if [ "$output" = $'2\nsomnia.Root' ]; then
                output_status=0
              else
                output_status=2
              fi
            else
              native_status=99
              output_status=99
            fi
            exit_status=$compile_status
            if [ "$exit_status" -eq 0 ]; then
              exit_status=$native_status
            fi
            if [ "$exit_status" -eq 0 ]; then
              exit_status=$output_status
            fi
            echo "exit_status=$exit_status"
          } > property-flow.txt 2>&1
          cat property-flow.txt
          exit "$(sed -n 's/^exit_status=//p' property-flow.txt | tail -n 1)"
      - name: Upload property-flow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-generator-string-flow
          path: property-flow.txt
          retention-days: 7
      - name: Require property-flow regression
        if: steps.property_flow.outcome != 'success'
        run: exit 1
      - name: Test unchanged Somnia parity
        id: somnia
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/deltathedumb/somnia.git ../somnia
          (
            cd ../somnia
            PYTHONPATH="$GITHUB_WORKSPACE" python tools/dualrun.py tests/parity/model_snapshot.py
          ) > somnia-parity.txt 2>&1
          cat somnia-parity.txt
      - name: Upload Somnia parity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somnia-provider-parity
          path: somnia-parity.txt
          retention-days: 7
      - name: Require Somnia parity
        if: steps.somnia.outcome != 'success'
        run: exit 1
