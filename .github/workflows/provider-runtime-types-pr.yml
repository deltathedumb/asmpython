name: Verify provider class values

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [beta/3.14.0]

permissions:
  contents: read

jobs:
  provider-class-values:
    if: github.event.pull_request.head.ref == 'fix/somnia-provider-runtime-types-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Test focused regression
        id: focused
        continue-on-error: true
        run: |
          set +e
          {
            python -m asmpython tests/cases/468_provider_type_runtime.py --target linux -o /tmp/asmpython-provider-types
            compile_status=$?
            echo "compile_status=$compile_status"
            if [ "$compile_status" -eq 0 ] && [ -x /tmp/asmpython-provider-types ]; then
              /tmp/asmpython-provider-types
              native_status=$?
              echo "native_status=$native_status"
            else
              native_status=99
            fi
            exit_status=$compile_status
            if [ "$exit_status" -eq 0 ]; then
              exit_status=$native_status
            fi
            echo "exit_status=$exit_status"
          } > provider-runtime-probe.txt 2>&1
          cat provider-runtime-probe.txt
          exit "$(sed -n 's/^exit_status=//p' provider-runtime-probe.txt | tail -n 1)"
      - name: Upload focused diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-runtime-probe
          path: provider-runtime-probe.txt
          retention-days: 7
      - name: Require focused regression
        if: steps.focused.outcome != 'success'
        run: exit 1
      - name: Test unchanged Somnia parity
        run: |
          git clone --depth 1 https://github.com/deltathedumb/somnia.git ../somnia
          (
            cd ../somnia
            PYTHONPATH="$GITHUB_WORKSPACE" python tools/dualrun.py tests/parity/model_snapshot.py
          )
