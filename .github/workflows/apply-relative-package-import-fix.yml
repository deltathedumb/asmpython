name: Apply relative package import fix

on:
  push:
    branches: [beta/3.14.0]
    paths:
      - ".github/workflows/apply-relative-package-import-fix.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/3.14.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Resolve relative package directories
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("asmpython/_compiler/program.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _resolve_relative(importer: Path, level: int, module: str, root: Path) -> Path | None:
              """Resolve a relative import (`from ..pkg.mod import x`) to a file path.

              `level` is the dot count: 1 = same package dir, 2 = parent, etc. `module`
              is the dotted remainder (may be ""). Returns the `.py` file or None if it
              doesn't resolve to a project file (or escapes the project root).
              """
              base = importer.parent
              # Each extra dot beyond the first walks up one directory.
              for _ in range(level - 1):
                  base = base.parent
              target = base
              if module:
                  for part in module.split("."):
                      target = target / part
              candidate = target.with_suffix(".py") if target.suffix == "" else target
              py = candidate if candidate.suffix == ".py" else Path(str(candidate) + ".py")
              if py.is_file() and (_within(py, root) or _is_within_stdlib(py)):
                  return py
              # `from . import submod` — module is "", the imported *name* is the module.
              return None
          '''
          new = '''def _resolve_relative(importer: Path, level: int, module: str, root: Path) -> Path | None:
              """Resolve a relative import to a module file or package initializer.

              `level` is the dot count: 1 = same package dir, 2 = parent, etc. `module`
              is the dotted remainder (may be ""). Both `module.py` and
              `module/__init__.py` are valid Python import targets.
              """
              base = importer.parent
              for _ in range(level - 1):
                  base = base.parent
              target = base
              if module:
                  for part in module.split("."):
                      target = target / part
              candidate = target.with_suffix(".py") if target.suffix == "" else target
              py = candidate if candidate.suffix == ".py" else Path(str(candidate) + ".py")
              if py.is_file() and (_within(py, root) or _is_within_stdlib(py)):
                  return py
              init = target / "__init__.py"
              if init.is_file() and (_within(init, root) or _is_within_stdlib(init)):
                  return init
              # `from . import submod` — module is "", the imported *name* is resolved
              # separately by `_project_imports` because each imported name may be a
              # distinct sibling module.
              return None
          '''
          if old not in text:
              raise SystemExit("expected _resolve_relative implementation was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Compile and run nested package re-export regression
        run: |
          python -m asmpython tests/cases/463_sibling_project_package.py \
            --target linux -o /tmp/asmpython-relative-package
          output=$(/tmp/asmpython-relative-package)
          printf '%s\n' "$output"
          test "$output" = "42"
      - name: Commit verified compiler fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-relative-package-import-fix.yml
          git add asmpython/_compiler/program.py
          git commit -m "Resolve relative package initializers"
          git push origin HEAD:beta/3.14.0
