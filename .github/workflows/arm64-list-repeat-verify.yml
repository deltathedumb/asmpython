name: Verify ARM64 list repeat

on:
  push:
    branches: ["beta/3.14.0"]
    paths:
      - "asmpython/_runtime/abi_lists_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_repeat.py"
      - "tests/test_arm64_list_repeat.py"
      - ".github/workflows/arm64-list-repeat-verify.yml"
  pull_request:
    paths:
      - "asmpython/_runtime/abi_lists_linux_arm64.S"
      - "asmpython/_backends/arm64/runtime_manifest.py"
      - "asmpython/_backends/arm64/_verify_list_repeat.py"
      - "tests/test_arm64_list_repeat.py"
      - ".github/workflows/arm64-list-repeat-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AArch64 binutils and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_repeat
      - name: Execute list repetition through QEMU
        run: python -m asmpython._backends.arm64._verify_list_repeat --mode cross

  native-verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - name: Run exact lowering and manifest tests
        run: python -m unittest -v tests.test_arm64_list_repeat
      - name: Execute list repetition natively
        run: python -m asmpython._backends.arm64._verify_list_repeat --mode native
