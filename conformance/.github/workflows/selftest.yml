# The suite's own correctness check.
#
# CPython must score 100% on the counted tiers. A failure here is a bug in the
# SUITE -- a hand-written expectation, a nondeterministic case, or a CPython
# implementation accident mis-tiered as though the language required it -- and
# never a bug in an implementation under test.
#
# Runs across versions because a case can be correct on one and wrong on
# another: behaviour genuinely changes (dict ordering became guaranteed in 3.7,
# f-string grammar in 3.12), and a case pinning the newer behaviour must be
# tiered and gated accordingly rather than silently failing older CPythons.
name: selftest

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly: catches drift as CPython itself moves

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: CPython must pass every counted case
        run: python selftest.py

      # The whole tree must be reproducible from its sources: generators for the
      # bodies, CPython for the expectations. Anything that differs afterwards
      # was hand-edited or has drifted.
      #
      # ORDER MATTERS and is easy to get wrong. A generator REWRITES the case
      # body from scratch, which removes the `# expect:` block, so regen must
      # run after them or every generated case looks changed. That also means
      # the two properties cannot be checked separately -- diffing between the
      # two steps compares against a deliberately half-written tree.
      - name: cases are reproducible from generators + CPython
        run: |
          for g in generators/gen_*.py; do python "$g"; done
          python regen.py --force
          git diff --exit-code -- cases/ \
            || (echo "::error::cases/ is not reproducible: a generator was edited without regenerating, or an expectation was hand-written" && exit 1)
